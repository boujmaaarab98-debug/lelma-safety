<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LELMA — SQCDP</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#242d42;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --text:#e8eaf0;--text2:#8b93a8;--text3:#4a5268;
  --fh:'Syne',sans-serif;--fm:'DM Mono',monospace;
  --hdr:52px;--tab:46px;
  --s:#f05252;--q:#3d7fff;--c:#22c97a;--d:#f5a623;--p:#a855f7;
  --mod:#f05252;--mod-dim:rgba(240,82,82,0.13);--mod-border:rgba(240,82,82,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fh);overflow:hidden;}

/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--hdr);display:flex;align-items:center;justify-content:space-between;padding:0 1.4rem;background:rgba(15,17,23,0.97);border-bottom:1px solid var(--border);backdrop-filter:blur(10px);}
.hdr-l{display:flex;align-items:center;gap:.8rem;}
.logo{font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.14em;background:var(--mod);color:#fff;padding:3px 10px;border-radius:4px;transition:background .25s;}
.hdr h1{font-size:14px;font-weight:700;}
.hdr-sub{font-family:var(--fm);font-size:9px;color:var(--text3);}
.hdr-r{display:flex;align-items:center;gap:.5rem;}
.vtog{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;}
.vt{font-family:var(--fh);font-size:11px;font-weight:500;padding:4px 13px;border-radius:5px;border:none;background:transparent;color:var(--text2);cursor:pointer;transition:.15s;}
.vt.active{background:var(--bg2);color:var(--text);border:1px solid var(--border2);}
.vt:hover:not(.active){color:var(--text);}
.mdate{font-family:var(--fm);font-size:10px;color:var(--text3);}

/* SQCDP BAR */
.sqbar{position:fixed;top:var(--hdr);left:0;right:0;z-index:55;height:var(--tab);display:flex;background:var(--bg2);border-bottom:1px solid var(--border);}
.sqt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;position:relative;}
.sqt:hover .sq-l{opacity:.8;}
.sqt.active{border-bottom-color:var(--sq-c,var(--mod));}
.sq-row{display:flex;align-items:center;gap:5px;}
.sq-l{font-size:14px;font-weight:700;transition:.2s;}
.sq-n{font-size:9.5px;font-weight:500;color:var(--text2);}
.sq-kpi{font-family:var(--fm);font-size:9px;color:var(--text3);}
.sqt[data-m="S"]{--sq-c:var(--s);} .sqt[data-m="S"] .sq-l{color:var(--s);}
.sqt[data-m="Q"]{--sq-c:var(--q);} .sqt[data-m="Q"] .sq-l{color:var(--q);}
.sqt[data-m="C"]{--sq-c:var(--c);} .sqt[data-m="C"] .sq-l{color:var(--c);}
.sqt[data-m="D"]{--sq-c:var(--d);} .sqt[data-m="D"] .sq-l{color:var(--d);}
.sqt[data-m="P"]{--sq-c:var(--p);} .sqt[data-m="P"] .sq-l{color:var(--p);}

/* VIEWS */
.view{position:fixed;top:calc(var(--hdr) + var(--tab));left:0;right:0;bottom:0;display:none;}
.view.active{display:flex;flex-direction:column;}

/* PLAN VIEW */
#vplan{background:var(--bg);position:relative;}
.plan-area{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem 2rem 0;min-height:0;overflow:hidden;}
#fp{width:auto;height:100%;max-width:100%;max-height:calc(100vh - 200px);display:block;}

/* SVG floor plan */
.fp-wall{fill:none;stroke:rgba(255,255,255,0.22);stroke-width:2;}
.fp-corr{fill:rgba(255,255,255,0.025);stroke:rgba(255,255,255,0.06);stroke-width:.8;}
.fp-dept rect{fill:rgba(255,255,255,0.04);stroke:rgba(255,255,255,0.12);stroke-width:1;transition:fill .18s,stroke .18s;}
.fp-dept.static rect{cursor:default;}
.fp-dept:not(.static){cursor:pointer;}
.fp-dept:not(.static):hover rect{fill:var(--mod-dim);stroke:var(--mod);stroke-width:1.5;}
.fp-dept.sel rect{fill:var(--mod-dim);stroke:var(--mod);stroke-width:2.5;}
.fp-dot{r:7;fill:#4a5268;transition:fill .2s;}
.fp-dept.lv-ok  .fp-dot{fill:#22c97a;}
.fp-dept.lv-warn .fp-dot{fill:#f5a623;}
.fp-dept.lv-bad  .fp-dot{fill:#f05252;}
.fp-t{fill:var(--text);font-family:'Syne',sans-serif;font-weight:500;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
.fp-s{fill:var(--text2);font-family:'DM Mono',monospace;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
.fp-s2{fill:#4a5268;font-family:'DM Mono',monospace;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
.fp-exit{fill:#f05252;}
.fp-north{fill:#555;font-family:'Syne',sans-serif;font-weight:700;text-anchor:middle;}

.plan-leg{flex-shrink:0;display:flex;gap:1.4rem;align-items:center;justify-content:center;padding:.45rem;background:rgba(15,17,23,0.8);border-top:1px solid var(--border);}
.leg-i{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:10px;color:var(--text3);}
.ldot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* OVERLAYS */
.ov{position:fixed;inset:0;z-index:200;display:flex;pointer-events:none;opacity:0;transition:opacity .2s;}
.ov.open{opacity:1;pointer-events:all;}
.ov-bg{flex:1;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);cursor:pointer;}
.ov-p{height:100%;background:var(--bg2);border-left:1px solid var(--border2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);}
.ov.open .ov-p{transform:none;}
#ov-dept .ov-p{width:min(490px,45vw);}

/* detail from left */
#ov-det{flex-direction:row-reverse;}
#ov-det .ov-p{width:min(540px,48vw);border-left:none;border-right:1px solid var(--border2);transform:translateX(-100%);}
#ov-det.open .ov-p{transform:none;}

/* panel internals */
.ph{padding:1.1rem 1.4rem .8rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:.7rem;flex-shrink:0;}
.ph h2{font-size:17px;font-weight:700;line-height:1.25;}
.ph-sub{font-family:var(--fm);font-size:10px;color:var(--text3);margin-top:3px;}
.ph-tag{display:inline-block;font-family:var(--fm);font-size:9px;padding:2px 8px;border-radius:4px;margin-bottom:4px;letter-spacing:.04em;background:var(--mod-dim);color:var(--mod);border:1px solid var(--mod-border);}
.xbtn{background:none;border:1px solid var(--border2);color:var(--text2);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.xbtn:hover{background:var(--bg3);}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:.8rem 1.4rem;flex-shrink:0;}
.pmc{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.65rem .85rem;}
.pml{font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--text3);text-transform:uppercase;margin-bottom:4px;}
.pmv{font-size:26px;font-weight:700;line-height:1;color:var(--text2);}
.pmv.cr{color:#f05252;}.pmv.ca{color:#f5a623;}.pmv.cg{color:#22c97a;}.pmv.cb{color:#3d7fff;}.pmv.cp{color:#a855f7;}
.pb{flex:1;overflow-y:auto;padding:0 1.4rem .8rem;}
.pb::-webkit-scrollbar{width:3px;}.pb::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.psec{font-family:var(--fm);font-size:10px;letter-spacing:.06em;color:var(--text3);text-transform:uppercase;margin:.55rem 0;display:flex;align-items:center;justify-content:space-between;}
.pcnt{background:var(--bg3);border:1px solid var(--border);padding:1px 8px;border-radius:10px;color:var(--text2);}
.irow{display:flex;gap:9px;padding:10px;border-radius:8px;margin-bottom:5px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;transition:.14s;}
.irow:hover{background:var(--bg4);border-color:var(--mod);}
.idate{font-family:var(--fm);font-size:9px;color:var(--text3);min-width:66px;padding-top:1px;flex-shrink:0;}
.ib{flex:1;min-width:0;}
.ititle{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px;}
.idesc{font-size:11px;color:var(--text2);line-height:1.45;margin-bottom:3px;}
.iarr{color:var(--text3);font-size:13px;flex-shrink:0;padding-top:1px;}
.badge{display:inline-block;font-family:var(--fm);font-size:9px;padding:2px 7px;border-radius:9px;text-transform:uppercase;letter-spacing:.04em;}
.bo{background:rgba(240,82,82,.12);color:#f05252;border:1px solid rgba(240,82,82,.25);}
.bc{background:rgba(34,201,122,.12);color:#22c97a;border:1px solid rgba(34,201,122,.25);}
.bp{background:rgba(245,166,35,.12);color:#f5a623;border:1px solid rgba(245,166,35,.25);}
.noitem{text-align:center;padding:1.5rem;color:var(--text3);font-family:var(--fm);font-size:11px;}
.pact{display:flex;gap:7px;padding:.75rem 1.4rem;border-top:1px solid var(--border);flex-shrink:0;}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;border-radius:7px;font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:.14s;}
.pbtn:hover{background:rgba(255,255,255,.05);color:var(--text);}
.pbtn.pr{background:var(--mod-dim);border-color:var(--mod-border);color:var(--mod);}
.pbtn.pr:hover{filter:brightness(1.1);}

/* detail steps */
.dback{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:10px;color:var(--text3);cursor:pointer;margin-bottom:.6rem;width:fit-content;}
.dback:hover{color:var(--mod);}
.dstep{margin-bottom:.6rem;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.dsh{display:flex;align-items:center;gap:8px;padding:.6rem .85rem;background:var(--bg3);}
.dnum{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:9px;font-weight:500;flex-shrink:0;background:var(--mod-dim);border:1px solid var(--mod-border);color:var(--mod);}
.dnum.ok{background:rgba(34,201,122,.12);border-color:rgba(34,201,122,.3);color:#22c97a;}
.dnum.pend{background:var(--bg4);border-color:var(--border);color:var(--text3);}
.dst{font-size:11px;font-weight:500;color:var(--text);}
.dss{margin-left:auto;font-family:var(--fm);font-size:9px;color:var(--text3);}
.dss.ok{color:#22c97a;}.dss.pr{color:#f5a623;}
.dsb{padding:.6rem .85rem;font-size:11px;color:var(--text2);line-height:1.6;border-top:1px solid var(--border);background:var(--bg2);}
.dsb.em{color:var(--text3);font-family:var(--fm);font-size:10px;}

/* DASHBOARD */
#vdash{overflow-y:auto;padding:.85rem;gap:.7rem;flex-direction:column;}
#vdash::-webkit-scrollbar{width:4px;}.#vdash::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.kr{display:grid;grid-template-columns:repeat(5,1fr);gap:.65rem;}
.kc{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:.8rem .9rem;}
.kl{font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--text3);text-transform:uppercase;margin-bottom:4px;}
.kv{font-size:26px;font-weight:700;line-height:1;}
.kv.cr{color:#f05252;}.kv.ca{color:#f5a623;}.kv.cg{color:#22c97a;}.kv.cb{color:#3d7fff;}.kv.cp{color:#a855f7;}
.ks{font-family:var(--fm);font-size:9px;color:var(--text3);margin-top:2px;}
.dr2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}
.dcard{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:.85rem .95rem;}
.dct{font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--text3);text-transform:uppercase;margin-bottom:.75rem;}
.cw{position:relative;height:185px;}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.prow:last-child{margin-bottom:0;}
.plbl{font-size:11px;color:var(--text2);min-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pbg{flex:1;height:7px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.pfill{height:100%;border-radius:3px;background:var(--mod);transition:width .5s;}
.pn{font-family:var(--fm);font-size:10px;color:var(--text3);min-width:24px;text-align:right;}
.dtbl{width:100%;border-collapse:collapse;font-size:11px;}
.dtbl th{font-family:var(--fm);font-size:9px;letter-spacing:.05em;color:var(--text3);text-transform:uppercase;padding:0 5px 7px;text-align:left;border-bottom:1px solid var(--border);}
.dtbl td{padding:6px 5px;border-bottom:1px solid var(--border);color:var(--text2);}
.dtbl tr:last-child td{border-bottom:none;}
.dtbl td:first-child{color:var(--text);font-weight:500;}
.tv{font-family:var(--fm);font-size:11px;font-weight:500;}
.tv.cr{color:#f05252;}.tv.ca{color:#f5a623;}.tv.cg{color:#22c97a;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <span class="logo" id="logo">LELMA</span>
    <div><h1 id="htitle">Sécurité &amp; Incendie</h1><div class="hdr-sub">Zone Franche · Tanger · Lot N°1</div></div>
  </div>
  <div class="hdr-r">
    <div class="vtog">
      <button class="vt active" onclick="switchView('plan',this)">🗺 Plan</button>
      <button class="vt" onclick="switchView('dash',this)">📊 Dashboard</button>
    </div>
    <span class="mdate" id="hdate"></span>
  </div>
</header>

<div class="sqbar">
  <div class="sqt active" data-m="S" onclick="switchMod('S',this)"><div class="sq-row"><span class="sq-l">S</span><span class="sq-n">Sécurité</span></div><span class="sq-kpi" id="kS"></span></div>
  <div class="sqt" data-m="Q" onclick="switchMod('Q',this)"><div class="sq-row"><span class="sq-l">Q</span><span class="sq-n">Qualité</span></div><span class="sq-kpi" id="kQ"></span></div>
  <div class="sqt" data-m="C" onclick="switchMod('C',this)"><div class="sq-row"><span class="sq-l">C</span><span class="sq-n">Coût</span></div><span class="sq-kpi" id="kC"></span></div>
  <div class="sqt" data-m="D" onclick="switchMod('D',this)"><div class="sq-row"><span class="sq-l">D</span><span class="sq-n">Délai</span></div><span class="sq-kpi" id="kD"></span></div>
  <div class="sqt" data-m="P" onclick="switchMod('P',this)"><div class="sq-row"><span class="sq-l">P</span><span class="sq-n">Personnel</span></div><span class="sq-kpi" id="kP"></span></div>
</div>

<!-- PLAN -->
<div id="vplan" class="view active">
  <div class="plan-area">
    <svg id="fp" viewBox="0 0 660 490" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <!-- corridors -->
      <rect class="fp-corr" x="15" y="15" width="490" height="72"/>
      <rect class="fp-corr" x="163" y="87" width="66" height="245"/>
      <rect class="fp-corr" x="343" y="87" width="66" height="106"/>
      <rect class="fp-corr" x="15" y="295" width="490" height="57"/>
      <!-- outer wall -->
      <rect class="fp-wall" x="14" y="14" rx="3" width="491" height="447"/>

      <!-- STOCKAGE NORD GAUCHE -->
      <g class="fp-dept" data-id="stockage" tabindex="0" role="button">
        <rect x="15" y="15" width="147" height="71"/>
        <circle class="fp-dot" cx="143" cy="27"/>
        <text class="fp-t" x="88" y="43" font-size="10.5">Stockage</text>
        <text class="fp-s" x="88" y="60" font-size="8">matière vide</text>
      </g>
      <!-- STOCKAGE NORD DROITE -->
      <g class="fp-dept" data-id="stockage" tabindex="0" role="button">
        <rect x="410" y="15" width="95" height="71"/>
        <circle class="fp-dot" cx="495" cy="27"/>
        <text class="fp-t" x="457" y="43" font-size="10.5">Stockage</text>
        <text class="fp-s" x="457" y="60" font-size="8">matière vide</text>
      </g>
      <!-- QT CONTROLE -->
      <g class="fp-dept" data-id="qc" tabindex="0" role="button">
        <rect x="15" y="87" width="147" height="207"/>
        <circle class="fp-dot" cx="143" cy="100"/>
        <text class="fp-t" x="88" y="178" font-size="10.5">QT Contrôle</text>
        <text class="fp-s" x="88" y="195" font-size="8.5">Qualité</text>
        <text class="fp-s2" x="88" y="211" font-size="7">Consommables &amp; Acc.</text>
      </g>
      <!-- BUREAU MAGASINIER -->
      <g class="fp-dept" data-id="magasinier" tabindex="0" role="button">
        <rect x="230" y="87" width="112" height="102"/>
        <circle class="fp-dot" cx="332" cy="100"/>
        <text class="fp-t" x="286" y="131" font-size="10.5">Bureau</text>
        <text class="fp-s" x="286" y="149" font-size="8.5">Magasinier</text>
      </g>
      <!-- BUREAU METHODES -->
      <g class="fp-dept" data-id="methodes" tabindex="0" role="button">
        <rect x="230" y="190" width="112" height="104"/>
        <circle class="fp-dot" cx="332" cy="203"/>
        <text class="fp-t" x="286" y="234" font-size="10.5">Bureau Méthodes</text>
        <text class="fp-s" x="286" y="252" font-size="8.5">&amp; CONT</text>
      </g>
      <!-- STATION -->
      <g class="fp-dept" data-id="station" tabindex="0" role="button">
        <rect x="410" y="87" width="95" height="207"/>
        <circle class="fp-dot" cx="495" cy="100"/>
        <text class="fp-t" x="457" y="185" font-size="9.5" transform="rotate(-90,457,185)">Station traitement</text>
        <text class="fp-s" x="457" y="205" font-size="7.5" transform="rotate(-90,457,208)">des effluents</text>
      </g>
      <!-- MACHINE -->
      <g class="fp-dept" data-id="machine" tabindex="0" role="button">
        <rect x="15" y="295" width="147" height="56"/>
        <circle class="fp-dot" cx="143" cy="308"/>
        <text class="fp-t" x="88" y="326" font-size="10.5">Machine</text>
      </g>
      <!-- ATELIER -->
      <g class="fp-dept" data-id="atelier" tabindex="0" role="button">
        <rect x="230" y="295" width="179" height="56"/>
        <circle class="fp-dot" cx="399" cy="308"/>
        <text class="fp-t" x="319" y="318" font-size="10.5">Atelier</text>
        <text class="fp-s" x="319" y="336" font-size="8">Traitement de surfaces</text>
      </g>
      <!-- ACCUEIL -->
      <g class="fp-dept" data-id="accueil" tabindex="0" role="button">
        <rect x="15" y="352" width="73" height="50"/>
        <circle class="fp-dot" cx="70" cy="364"/>
        <text class="fp-t" x="51" y="381" font-size="9.5">Accueil</text>
      </g>
      <!-- CHEF DE ZONE -->
      <g class="fp-dept" data-id="chef" tabindex="0" role="button">
        <rect x="89" y="352" width="73" height="50"/>
        <circle class="fp-dot" cx="143" cy="364"/>
        <text class="fp-t" x="125" y="372" font-size="9.5">Chef</text>
        <text class="fp-s" x="125" y="388" font-size="7.5">de Zone</text>
      </g>
      <!-- INFIRMERIE -->
      <g class="fp-dept" data-id="infirmerie" tabindex="0" role="button">
        <rect x="163" y="352" width="66" height="50"/>
        <circle class="fp-dot" cx="210" cy="364"/>
        <text class="fp-t" x="196" y="381" font-size="9">Infirmerie</text>
      </g>
      <!-- REUNION -->
      <g class="fp-dept" data-id="reunion" tabindex="0" role="button">
        <rect x="330" y="352" width="80" height="50"/>
        <circle class="fp-dot" cx="399" cy="364"/>
        <text class="fp-t" x="370" y="372" font-size="9.5">Salle de</text>
        <text class="fp-s" x="370" y="388" font-size="7.5">Réunion</text>
      </g>
      <!-- STATIC ROOMS -->

// ══ STATE ══
let mod='S', curView='plan', curDept=null, charts={};

// ══ INIT ══
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('hdate').textContent=new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
  setModCSS('S');
  applyDots();
  updateTabKPIs();
  bindClicks();
});

function setModCSS(m){
  const M=MODS[m];
  const r=document.documentElement.style;
  r.setProperty('--mod',M.color);
  r.setProperty('--mod-dim',M.dim);
  r.setProperty('--mod-border',M.border);
  document.getElementById('logo').style.background=M.color;
  document.getElementById('htitle').textContent=M.htitle;
}

function updateTabKPIs(){
  Object.keys(MODS).forEach(m=>{
    document.getElementById('k'+m).textContent=MODS[m].kpi(DATA[m]);
  });
}

function applyDots(){
  const M=MODS[mod]; const data=DATA[mod];
  DBASE.forEach(dept=>{
    const d=data[dept.id]||{};
    const lv=M.dot(d);
    document.querySelectorAll(`.fp-dept[data-id="${dept.id}"]`).forEach(el=>{
      el.classList.remove('lv-ok','lv-warn','lv-bad');
      el.classList.add(lv);
    });
  });
}

function bindClicks(){
  document.querySelectorAll('.fp-dept[data-id]').forEach(el=>{
    el.addEventListener('click',()=>openDept(el.dataset.id));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDept(el.dataset.id);}});
  });
}

function switchMod(m,el){
  mod=m;
  setModCSS(m);
  document.querySelectorAll('.sqt').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  applyDots();
  closeDept(); closeDet();
  if(curView==='dash') buildDash();
}

function switchView(v,btn){
  curView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.vt').forEach(el=>el.classList.remove('active'));
  document.getElementById('v'+v).classList.add('active');
  btn.classList.add('active');
  if(v==='dash') buildDash();
}

function openDept(id){
  curDept=id;
  const M=MODS[mod]; const data=DATA[mod][id]||{}; const dept=DBASE.find(d=>d.id===id);
  document.querySelectorAll('.fp-dept').forEach(el=>el.classList.remove('sel'));
  document.querySelectorAll(`.fp-dept[data-id="${id}"]`).forEach(el=>el.classList.add('sel'));
  const tag=document.getElementById('dp-tag');
  tag.textContent=mod+' — '+M.label.toUpperCase();
  tag.style.cssText=`background:${M.dim};color:${M.color};border:1px solid ${M.border}`;
  document.getElementById('dp-name').textContent=dept?.name||id;
  document.getElementById('dp-zone').textContent=dept?.zone||'';
  const items=data.items||[];
  document.getElementById('dp-cnt').textContent=items.length;
  document.getElementById('dp-metrics').innerHTML=M.metrics.map((lbl,i)=>
    `<div class="pmc"><div class="pml">${lbl}</div><div class="pmv ${M.mc[i]}">${data[M.mk[i]]??'—'}</div></div>`
  ).join('');
  document.getElementById('dp-items').innerHTML=items.length===0
    ?'<div class="noitem">✓ Aucun enregistrement</div>'
    :items.map((it,i)=>`
      <div class="irow" onclick="openDet(${i})">
        <div class="idate">${it.date}</div>
        <div class="ib">
          <div class="ititle">${it.title} <span style="opacity:.45;font-size:9px;font-family:var(--fm)">${it.id}</span></div>
          <div class="idesc">${it.desc}</div>
          <span class="badge ${it.status==='open'?'bo':it.status==='closed'?'bc':'bp'}">${it.status==='open'?'Ouvert':it.status==='closed'?'Clôturé':'En cours'}</span>
        </div>
        <div class="iarr">›</div>
      </div>`).join('');
  document.getElementById('ov-dept').classList.add('open');
}
function closeDept(){
  document.getElementById('ov-dept').classList.remove('open');
  document.querySelectorAll('.fp-dept').forEach(el=>el.classList.remove('sel'));
  curDept=null;
}

function openDet(idx){
  const M=MODS[mod]; const data=DATA[mod][curDept]; const it=data.items[idx];
  const dept=DBASE.find(d=>d.id===curDept);
  document.getElementById('det-title').textContent=it.title;
  document.getElementById('det-sub').textContent=`${dept?.name} · ${it.date} · ${it.id}`;
  document.getElementById('det-status').innerHTML=`<span class="badge ${it.status==='open'?'bo':it.status==='closed'?'bc':'bp'}" style="font-size:10px;padding:3px 10px">${it.status==='open'?'Ouvert':it.status==='closed'?'Clôturé':'En cours'}</span>`;
  document.getElementById('det-body').innerHTML=M.steps.map((st,i)=>{
    const v=it.steps?.[i]; const done=!!v&&it.status==='closed'; const pend=!v;
    return`<div class="dstep"><div class="dsh"><div class="dnum ${done?'ok':pend?'pend':''}">${i+1}</div><div class="dst">${st}</div><div class="dss ${done?'ok':pend?'':'pr'}">${done?'✓ Fait':pend?'En attente':'En cours'}</div></div><div class="dsb ${pend?'em':''}">${v||'Non renseigné — à compléter dans Google Sheet'}</div></div>`;
  }).join('');
  document.getElementById('ov-det').classList.add('open');
}
function closeDet(){ document.getElementById('ov-det').classList.remove('open'); }
function openSheet(){ window.open(SHEET_URL,'_blank'); }

function buildDash(){
  const M=MODS[mod]; const data=DATA[mod];
  const vals=DBASE.map(d=>data[d.id]||{});
  const names=DBASE.map(d=>d.name.length>13?d.name.slice(0,13)+'…':d.name);
  ['cpie','cline','cbar'].forEach(id=>{if(charts[id]){charts[id].destroy();delete charts[id];}});
  // KPIs
  const kpis=M.mk.map(k=>Math.round(vals.reduce((s,v)=>s+(v[k]||0),0)*10)/10);
  document.getElementById('kr').innerHTML=M.metrics.map((lbl,i)=>
    `<div class="kc"><div class="kl">${lbl}</div><div class="kv ${M.mc[i]}">${kpis[i]}</div><div class="ks">total</div></div>`
  ).join('')+`<div class="kc"><div class="kl">Départements</div><div class="kv cb">${DBASE.length}</div><div class="ks">analysés</div></div>`;
  // titles
  document.getElementById('ct1').textContent=M.label+' — pareto par département';
  document.getElementById('ct2').textContent='Statuts enregistrements';
  document.getElementById('ct3').textContent='Évolution mensuelle 2025';
  document.getElementById('ct4').textContent=M.metrics[0]+' par département';
  // Pareto
  const pd=DBASE.map(d=>({name:d.name,n:(data[d.id]?.items?.length||0)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  const mx=pd[0]?.n||1;
  document.getElementById('pareto').innerHTML=pd.length===0?'<div class="noitem">Aucune donnée</div>':pd.map(x=>`<div class="prow"><div class="plbl">${x.name.length>16?x.name.slice(0,16)+'…':x.name}</div><div class="pbg"><div class="pfill" style="width:${Math.round(x.n/mx*100)}%"></div></div><div class="pn">${x.n}</div></div>`).join('');
  // Pie
  let op=0,pr=0,cl=0;
  vals.forEach(v=>(v.items||[]).forEach(i=>{if(i.status==='open')op++;else if(i.status==='progress')pr++;else cl++;}));
  charts['cpie']=new Chart(document.getElementById('cpie'),{type:'doughnut',data:{labels:['Ouverts','En cours','Clôturés'],datasets:[{data:[op,pr,cl],backgroundColor:['#f05252','#f5a623','#22c97a'],borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#8b93a8',font:{size:10},boxWidth:10,padding:8}}}}});
  // Line
  const months=['Jan','Fév','Mar','Avr','Mai','Jun'];
  const base=kpis[0]||1;
  charts['cline']=new Chart(document.getElementById('cline'),{type:'line',data:{labels:months,datasets:[{label:M.metrics[0],data:months.map((_,i)=>Math.max(0,Math.round((base*(0.55+i*0.09+Math.random()*0.08))*10)/10)),borderColor:M.color,backgroundColor:M.dim,tension:.4,fill:true,pointBackgroundColor:M.color,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b93a8'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#8b93a8'},grid:{color:'rgba(255,255,255,0.04)'}}}}});
  // Bar
  const bv=DBASE.map(d=>(data[d.id]?.[M.mk[0]])||0);
  charts['cbar']=new Chart(document.getElementById('cbar'),{type:'bar',data:{labels:names,datasets:[{data:bv,backgroundColor:bv.map(v=>v===0?'#22c97a':M.color),borderRadius:4,borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b93a8'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#8b93a8',font:{size:10}},grid:{display:false}}}}});
  // Table
  document.getElementById('dtbl').innerHTML=`<thead><tr><th>Département</th>${M.tblC.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${DBASE.map(dept=>{
    const dv=data[dept.id]||{};
    const cells=M.tblK.map(k=>{
      const v=dv[k]??'—';
      let cls='';
      if(mod==='S'){if(k==='open')cls=v>0?'cr':'cg';if(k==='accidents')cls=v>5?'cr':v>0?'ca':'cg';}
      if(mod==='Q'){if(k==='ncr')cls=v>3?'cr':v>0?'ca':'cg';if(k==='rebut')cls=v>3?'cr':v>1?'ca':'cg';}
      if(mod==='C'){if(k==='ecart')cls=v>10?'cr':v>0?'ca':'cg';}
      if(mod==='D'){if(k==='otd')cls=v<80?'cr':v<90?'ca':'cg';if(k==='retards')cls=v>5?'cr':v>0?'ca':'cg';}
      if(mod==='P'){if(k==='absenteisme')cls=v>5?'cr':v>2?'ca':'cg';}
      return`<td><span class="tv ${cls}">${v}</span></td>`;
    }).join('');
    const its=dv.items||[];const hasO=its.some(i=>i.status==='open');const hasP=its.some(i=>i.status==='progress');
    return`<tr><td>${dept.name}</td>${cells}<td><span class="badge ${hasO?'bo':hasP?'bp':'bc'}">${hasO?'Critique':hasP?'En cours':'OK'}</span></td></tr>`;
  }).join('')}</tbody>`;
}
