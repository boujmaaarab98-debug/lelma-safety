<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LELMA — Sécurité Incendie</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#242d42;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf0;--text2:#8b93a8;--text3:#4a5268;
  --accent:#3d7fff;--accent-dim:rgba(61,127,255,0.15);
  --green:#22c97a;--green-dim:rgba(34,201,122,0.12);
  --amber:#f5a623;--amber-dim:rgba(245,166,35,0.12);
  --red:#f05252;--red-dim:rgba(240,82,82,0.12);
  --fh:'Syne',sans-serif;--fm:'DM Mono',monospace;
  --hdr:52px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:var(--fh);overflow:hidden;}

/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:var(--hdr);background:rgba(15,17,23,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.hdr-l{display:flex;align-items:center;gap:.85rem;}
.logo{font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.15em;background:var(--accent);color:#fff;padding:3px 10px;border-radius:4px;}
.hdr h1{font-size:14px;font-weight:700;}
.hdr-sub{font-family:var(--fm);font-size:9px;color:var(--text3);}
.hdr-r{display:flex;align-items:center;gap:.6rem;}
.pill{font-family:var(--fm);font-size:10px;padding:3px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);}
.pill.danger{border-color:var(--red);color:var(--red);background:var(--red-dim);}
.mdate{font-family:var(--fm);font-size:10px;color:var(--text3);}
.nav{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;}
.nav-btn{font-family:var(--fh);font-size:12px;font-weight:500;padding:5px 16px;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;transition:.15s;}
.nav-btn.active{background:var(--bg2);color:var(--text);border:1px solid var(--border2);}
.nav-btn:hover:not(.active){color:var(--text);}

/* VIEWS */
.view{position:fixed;top:var(--hdr);left:0;right:0;bottom:0;display:none;}
.view.active{display:block;}

/* ══ PLAN VIEW ══ */
#view-plan{background:var(--bg);}
.plan-full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.2rem 1.2rem 2.8rem;}
#floorplan{width:100%;height:100%;display:block;}
.outer-wall{fill:none;stroke:rgba(255,255,255,0.2);stroke-width:2.5;}
.corridor{fill:rgba(34,201,122,0.08);stroke:rgba(34,201,122,0.2);stroke-width:.8;}
.dept rect{fill:rgba(255,255,255,0.03);stroke:rgba(255,255,255,0.11);stroke-width:1.2;transition:fill .18s,stroke .18s;}
.dept.static rect{cursor:default;}
.dept:not(.static){cursor:pointer;}
.dept:not(.static):hover rect{fill:rgba(61,127,255,0.13);stroke:var(--accent);stroke-width:1.8;}
.dept.active rect{fill:rgba(61,127,255,0.2);stroke:var(--accent);stroke-width:2.5;}
.dept-dot{fill:var(--text3);transition:fill .2s;}
.dept.s-green .dept-dot{fill:var(--green);}
.dept.s-amber .dept-dot{fill:var(--amber);}
.dept.s-red   .dept-dot{fill:var(--red);}
.dt{fill:var(--text);font-family:'Syne',sans-serif;font-weight:500;text-anchor:middle;pointer-events:none;}
.ds{fill:var(--text2);font-family:'DM Mono',monospace;text-anchor:middle;pointer-events:none;}
.ds2{fill:var(--text3);font-family:'DM Mono',monospace;text-anchor:middle;pointer-events:none;}
.exit-mk{fill:var(--red);}
.north-lbl{fill:var(--text3);font-family:'Syne',sans-serif;font-weight:700;text-anchor:middle;}
.plan-legend{position:absolute;bottom:0;left:0;right:0;display:flex;gap:1.5rem;align-items:center;justify-content:center;padding:.5rem 1rem;background:rgba(15,17,23,0.75);backdrop-filter:blur(8px);border-top:1px solid var(--border);}
.leg-i{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:11px;color:var(--text3);}
.leg-dot{width:9px;height:9px;border-radius:50%;}
.leg-dot.g{background:var(--green);}.leg-dot.a{background:var(--amber);}.leg-dot.r{background:var(--red);}
.leg-arr{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:10px solid var(--red);}

/* ══ SIDE PANELS ══ */
.overlay{position:fixed;inset:0;z-index:200;display:flex;pointer-events:none;opacity:0;transition:opacity .25s;}
.overlay.open{opacity:1;pointer-events:all;}
.ov-backdrop{flex:1;background:rgba(0,0,0,0.5);backdrop-filter:blur(3px);cursor:pointer;}
.ov-panel{height:100%;background:var(--bg2);border-left:1px solid var(--border2);display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.overlay.open .ov-panel{transform:translateX(0);}

/* DEPT PANEL */
#dept-overlay .ov-panel{width:min(520px,48vw);}
.dp-head{padding:1.3rem 1.5rem .9rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;flex-shrink:0;}
.dp-head h2{font-size:19px;font-weight:700;line-height:1.25;}
.dp-zone{font-family:var(--fm);font-size:10px;color:var(--text3);margin-top:3px;}
.ov-close{background:none;border:1px solid var(--border2);color:var(--text2);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ov-close:hover{background:var(--bg3);color:var(--text);}
.dp-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:.9rem 1.5rem;flex-shrink:0;}
.dp-metric{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:.75rem .9rem;}
.dp-mlbl{font-family:var(--fm);font-size:9px;letter-spacing:.07em;color:var(--text3);text-transform:uppercase;margin-bottom:5px;}
.dp-mval{font-size:30px;font-weight:700;line-height:1;color:var(--text2);}
.dp-mval.cr{color:var(--red);}.dp-mval.ca{color:var(--amber);}.dp-mval.cg{color:var(--green);}
.dp-body{flex:1;overflow-y:auto;padding:0 1.5rem 1rem;}
.dp-body::-webkit-scrollbar{width:3px;}
.dp-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.dp-sec{font-family:var(--fm);font-size:10px;letter-spacing:.07em;color:var(--text3);text-transform:uppercase;margin:.5rem 0 .7rem;display:flex;align-items:center;justify-content:space-between;}
.dp-cnt{background:var(--bg3);border:1px solid var(--border);padding:2px 8px;border-radius:10px;color:var(--text2);}

/* incident row — clickable */
.inc-row{display:flex;gap:12px;padding:12px;border-radius:10px;margin-bottom:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;transition:background .15s,border-color .15s;}
.inc-row:hover{background:var(--bg4);border-color:var(--accent);}
.inc-row:last-child{margin-bottom:0;}
.inc-date{font-family:var(--fm);font-size:10px;color:var(--text3);min-width:72px;padding-top:1px;flex-shrink:0;}
.inc-b{flex:1;min-width:0;}
.inc-type{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.inc-desc{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:4px;}
.inc-act{font-family:var(--fm);font-size:10px;color:var(--text3);}
.inc-arrow{margin-left:auto;color:var(--text3);font-size:14px;flex-shrink:0;padding-top:1px;}
.badge{display:inline-block;font-family:var(--fm);font-size:9px;letter-spacing:.05em;padding:2px 8px;border-radius:10px;text-transform:uppercase;}
.b-open{background:var(--red-dim);color:var(--red);border:1px solid rgba(240,82,82,.25);}
.b-closed{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,201,122,.25);}
.b-prog{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,166,35,.25);}
.no-inc{text-align:center;padding:2rem;color:var(--text3);font-family:var(--fm);font-size:12px;}
.dp-actions{display:flex;gap:8px;padding:.9rem 1.5rem;border-top:1px solid var(--border);flex-shrink:0;}
.dp-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:8px;font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:.15s;}
.dp-btn:hover{background:rgba(255,255,255,.06);color:var(--text);}
.dp-btn.prim{background:var(--accent-dim);border-color:rgba(61,127,255,.3);color:#7aaeff;}
.dp-btn.prim:hover{background:rgba(61,127,255,.25);color:#fff;}

/* ══ 8D PANEL ══ */
#eightd-overlay{flex-direction:row-reverse;}
#eightd-overlay .ov-backdrop{flex:1;}
#eightd-overlay .ov-panel{width:min(580px,52vw);border-left:none;border-right:1px solid var(--border2);transform:translateX(-100%);}
#eightd-overlay.open .ov-panel{transform:translateX(0);}
.ed-head{padding:1.3rem 1.5rem .9rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.ed-back{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;color:var(--text3);cursor:pointer;margin-bottom:.6rem;width:fit-content;padding:3px 0;}
.ed-back:hover{color:var(--accent);}
.ed-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;}
.ed-title-row h2{font-size:17px;font-weight:700;line-height:1.3;}
.ed-ref{font-family:var(--fm);font-size:10px;color:var(--text3);margin-top:3px;}
.ed-status-row{display:flex;align-items:center;gap:8px;margin-top:.7rem;}

.ed-body{flex:1;overflow-y:auto;padding:1rem 1.5rem 1rem;}
.ed-body::-webkit-scrollbar{width:3px;}
.ed-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

.d-step{margin-bottom:1rem;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.d-step-head{display:flex;align-items:center;gap:10px;padding:.7rem 1rem;background:var(--bg3);}
.d-num{width:26px;height:26px;border-radius:50%;background:var(--accent-dim);border:1px solid rgba(61,127,255,.3);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:10px;font-weight:500;color:var(--accent);flex-shrink:0;}
.d-num.done{background:var(--green-dim);border-color:rgba(34,201,122,.3);color:var(--green);}
.d-num.pending{background:var(--bg4);border-color:var(--border);color:var(--text3);}
.d-step-title{font-size:12px;font-weight:500;color:var(--text);}
.d-step-sub{font-family:var(--fm);font-size:9px;color:var(--text3);margin-left:auto;}
.d-step-body{padding:.8rem 1rem;font-size:12px;color:var(--text2);line-height:1.65;border-top:1px solid var(--border);background:var(--bg2);}
.d-step-body.empty{color:var(--text3);font-family:var(--fm);font-size:11px;}

.ed-actions{display:flex;gap:8px;padding:.9rem 1.5rem;border-top:1px solid var(--border);flex-shrink:0;}

/* ══ DASHBOARD ══ */
#view-dash{overflow-y:auto;padding:1.2rem;display:none;flex-direction:column;gap:.85rem;}
#view-dash.active{display:flex;}
#view-dash::-webkit-scrollbar{width:4px;}
#view-dash::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;}
.kpi-lbl{font-family:var(--fm);font-size:9px;letter-spacing:.07em;color:var(--text3);text-transform:uppercase;margin-bottom:5px;}
.kpi-val{font-size:30px;font-weight:700;line-height:1;}
.kpi-val.cr{color:var(--red);}.kpi-val.ca{color:var(--amber);}.kpi-val.cg{color:var(--green);}.kpi-val.cb{color:var(--accent);}
.kpi-sub{font-family:var(--fm);font-size:9px;color:var(--text3);margin-top:3px;}
.dash-row{display:grid;gap:.75rem;}
.dash-row.two{grid-template-columns:1fr 1fr;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;}
.card-title{font-family:var(--fm);font-size:10px;letter-spacing:.07em;color:var(--text3);text-transform:uppercase;margin-bottom:.9rem;}
.chart-wrap{position:relative;height:200px;}
.pareto-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.pareto-row:last-child{margin-bottom:0;}
.p-lbl{font-size:11px;color:var(--text2);min-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-bg{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.p-fill{height:100%;border-radius:4px;transition:width .5s;}
.p-fill.r{background:var(--red);}.p-fill.a{background:var(--amber);}.p-fill.c{background:var(--accent);}
.p-n{font-family:var(--fm);font-size:10px;color:var(--text3);min-width:20px;text-align:right;}
.dept-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.dept-tbl th{font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--text3);text-transform:uppercase;padding:0 6px 8px;text-align:left;border-bottom:1px solid var(--border);}
.dept-tbl td{padding:8px 6px;border-bottom:1px solid var(--border);color:var(--text2);}
.dept-tbl tr:last-child td{border-bottom:none;}
.dept-tbl td:first-child{color:var(--text);font-weight:500;}
.tv{font-family:var(--fm);font-size:12px;font-weight:500;}
.tv.cr{color:var(--red);}.tv.ca{color:var(--amber);}.tv.cg{color:var(--green);}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <span class="logo">LELMA</span>
    <div><h1>Sécurité &amp; Incendie</h1><div class="hdr-sub">Zone Franche · Tanger · Lot N°1</div></div>
  </div>
  <div class="hdr-r">
    <div class="nav">
      <button class="nav-btn active" onclick="switchView('plan',this)">🗺 Plan</button>
      <button class="nav-btn" onclick="switchView('dash',this)">📊 Dashboard</button>
    </div>
    <div class="pill" id="h-acc">— AT</div>
    <div class="pill danger" id="h-8d">— 8D</div>
    <span class="mdate" id="h-date"></span>
  </div>
</header>

<!-- PLAN -->
<div id="view-plan" class="view active">
  <div class="plan-full">
    <svg id="floorplan" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <rect class="corridor" x="16" y="16" width="518" height="76"/>
      <rect class="corridor" x="172" y="92" width="70" height="258"/>
      <rect class="corridor" x="362" y="92" width="70" height="112"/>
      <rect class="corridor" x="16" y="308" width="518" height="60"/>
      <rect class="outer-wall" rx="4" x="15" y="15" width="519" height="472"/>
      <g class="dept" data-id="stockage" tabindex="0" role="button"><rect x="16" y="16" width="155" height="75"/><text x="93" y="46" class="dt" font-size="11">Stockage</text><text x="93" y="64" class="ds" font-size="8.5">matière vide</text><circle class="dept-dot" cx="152" cy="29" r="7"/></g>
      <g class="dept" data-id="stockage" tabindex="0" role="button"><rect x="433" y="16" width="101" height="75"/><text x="483" y="46" class="dt" font-size="11">Stockage</text><text x="483" y="64" class="ds" font-size="8.5">matière vide</text><circle class="dept-dot" cx="524" cy="29" r="7"/></g>
      <g class="dept" data-id="qc" tabindex="0" role="button"><rect x="16" y="92" width="155" height="215"/><text x="93" y="193" class="dt" font-size="11">QT Contrôle</text><text x="93" y="212" class="ds" font-size="9">Qualité</text><text x="93" y="229" class="ds2" font-size="7.5">Consommables &amp; Acc.</text><circle class="dept-dot" cx="152" cy="107" r="7"/></g>
      <g class="dept" data-id="magasinier" tabindex="0" role="button"><rect x="243" y="92" width="118" height="108"/><text x="302" y="142" class="dt" font-size="11">Bureau</text><text x="302" y="161" class="ds" font-size="9">Magasinier</text><circle class="dept-dot" cx="346" cy="107" r="7"/></g>
      <g class="dept" data-id="methodes" tabindex="0" role="button"><rect x="243" y="201" width="118" height="106"/><text x="302" y="248" class="dt" font-size="11">Bureau Méthodes</text><text x="302" y="267" class="ds" font-size="9">&amp; CONT</text><circle class="dept-dot" cx="346" cy="215" r="7"/></g>
      <g class="dept" data-id="station" tabindex="0" role="button"><rect x="433" y="92" width="101" height="215"/><text x="483" y="193" class="dt" font-size="10" transform="rotate(-90,483,193)">Station traitement</text><text x="483" y="215" class="ds" font-size="8" transform="rotate(-90,483,218)">des effluents</text><circle class="dept-dot" cx="524" cy="107" r="7"/></g>
      <g class="dept" data-id="machine" tabindex="0" role="button"><rect x="16" y="308" width="155" height="59"/><text x="93" y="341" class="dt" font-size="11">Machine</text><circle class="dept-dot" cx="152" cy="322" r="7"/></g>
      <g class="dept" data-id="atelier" tabindex="0" role="button"><rect x="243" y="308" width="189" height="59"/><text x="337" y="334" class="dt" font-size="11">Atelier</text><text x="337" y="353" class="ds" font-size="8.5">Traitement de surfaces</text><circle class="dept-dot" cx="416" cy="322" r="7"/></g>
      <g class="dept" data-id="accueil" tabindex="0" role="button"><rect x="16" y="369" width="77" height="53"/><text x="54" y="399" class="dt" font-size="10">Accueil</text><circle class="dept-dot" cx="74" cy="382" r="6"/></g>
      <g class="dept" data-id="chef" tabindex="0" role="button"><rect x="94" y="369" width="77" height="53"/><text x="132" y="390" class="dt" font-size="10">Chef</text><text x="132" y="407" class="ds" font-size="8">de Zone</text><circle class="dept-dot" cx="152" cy="382" r="6"/></g>
      <g class="dept" data-id="infirmerie" tabindex="0" role="button"><rect x="172" y="369" width="70" height="53"/><text x="207" y="399" class="dt" font-size="10">Infirmerie</text><circle class="dept-dot" cx="222" cy="382" r="6"/></g>
      <g class="dept" data-id="reunion" tabindex="0" role="button"><rect x="348" y="369" width="85" height="53"/><text x="390" y="390" class="dt" font-size="10">Salle de</text><text x="390" y="407" class="ds" font-size="8">Réunion</text><circle class="dept-dot" cx="416" cy="382" r="6"/></g>
      <g class="dept static"><rect x="16" y="424" width="77" height="50"/><text x="54" y="452" class="ds" font-size="8">Vestiaire H</text></g>
      <g class="dept static"><rect x="94" y="424" width="57" height="50"/><text x="122" y="452" class="ds" font-size="8">Douche H</text></g>
      <g class="dept static"><rect x="152" y="424" width="48" height="50"/><text x="176" y="452" class="ds" font-size="8">WC H</text></g>
      <g class="dept static"><rect x="243" y="424" width="77" height="50"/><text x="281" y="452" class="ds" font-size="8">Vestiaire F</text></g>
      <g class="dept static"><rect x="321" y="424" width="59" height="50"/><text x="350" y="452" class="ds" font-size="8">Douche F</text></g>
      <g class="dept static"><rect x="381" y="424" width="49" height="50"/><text x="405" y="452" class="ds" font-size="8">WC F</text></g>
      <polygon class="exit-mk" points="0,58 15,50 15,66"/>
      <polygon class="exit-mk" points="548,58 534,50 534,66"/>
      <polygon class="exit-mk" points="272,0 264,15 280,15"/>
      <polygon class="exit-mk" points="466,535 458,520 474,520"/>
      <g transform="translate(640,35)"><text x="0" y="13" class="north-lbl" font-size="13">N</text><line x1="7" y1="17" x2="7" y2="42" stroke="#444" stroke-width="2"/><polygon points="3,17 7,6 11,17" fill="#555"/></g>
    </svg>
  </div>
  <div class="plan-legend">
    <div class="leg-i"><span class="leg-dot g"></span>Aucun incident</div>
    <div class="leg-i"><span class="leg-dot a"></span>Incidents clôturés</div>
    <div class="leg-i"><span class="leg-dot r"></span>8D ouvert</div>
    <div class="leg-i"><span class="leg-arr"></span>Issue de secours</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="view-dash" class="view">
  <div class="kpi-row" id="kpi-row"></div>

</div>

// ══ STATE ══
let chartsInit=false;
let currentDeptId=null;

// ══ INIT ══
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('h-date').textContent=new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
  applyDots();updateHeader();bindClicks();
});

function applyDots(){
  Object.entries(DEPTS).forEach(([id,d])=>{
    const c=d.open8D>0?'s-red':(d.accidents>0||d.nearMiss>0)?'s-amber':'s-green';
    document.querySelectorAll(`.dept[data-id="${id}"]`).forEach(el=>el.classList.add(c));
  });
}
function updateHeader(){
  let acc=0,od=0;Object.values(DEPTS).forEach(d=>{acc+=d.accidents;od+=d.open8D;});
  document.getElementById('h-acc').textContent=acc+' AT';
  const el=document.getElementById('h-8d');
  el.textContent=od+' 8D ouverts';el.className=od>0?'pill danger':'pill';
}
function bindClicks(){
  document.querySelectorAll('.dept[data-id]').forEach(el=>{
    el.addEventListener('click',()=>openDept(el.getAttribute('data-id')));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDept(el.getAttribute('data-id'));}});
  });
}
function switchView(v,btn){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  btn.classList.add('active');
  if(v==='dash'&&!chartsInit){initCharts();chartsInit=true;}
}

// ══ DEPT PANEL ══
function openDept(id){
  currentDeptId=id;
  document.querySelectorAll('.dept').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll(`.dept[data-id="${id}"]`).forEach(el=>el.classList.add('active'));
  const d=DEPTS[id];if(!d)return;
  document.getElementById('dp-name').textContent=d.name;
  document.getElementById('dp-zone').textContent=d.zone;
  document.getElementById('dp-cnt').textContent=d.incidents.length;
  const ac=d.accidents>5?'cr':d.accidents>0?'ca':'cg';
  const oc=d.open8D>0?'cr':'cg';
  document.getElementById('dp-metrics').innerHTML=`
    <div class="dp-metric"><div class="dp-mlbl">Accidents AT</div><div class="dp-mval ${ac}">${d.accidents}</div></div>
    <div class="dp-metric"><div class="dp-mlbl">Presque accidents</div><div class="dp-mval ca">${d.nearMiss}</div></div>
    <div class="dp-metric"><div class="dp-mlbl">8D ouverts</div><div class="dp-mval ${oc}">${d.open8D}</div></div>
    <div class="dp-metric"><div class="dp-mlbl">Total incidents</div><div class="dp-mval">${d.incidents.length}</div></div>`;

  document.getElementById('dp-incs').innerHTML=d.incidents.length===0
    ?'<div class="no-inc">✓ Aucun incident enregistré</div>'
    :d.incidents.map((i,idx)=>`
      <div class="inc-row" onclick="openIncident('${id}',${idx})">
        <div class="inc-date">${i.date}</div>
        <div class="inc-b">
          <div class="inc-type">
            ${i.type}
            ${i.ref8D?`<span class="badge b-open" style="font-size:8px">${i.ref8D}</span>`:''}
          </div>
          <div class="inc-desc">${i.desc}</div>
          <span class="badge ${i.status==='open'?'b-open':i.status==='closed'?'b-closed':'b-prog'}">${i.status==='open'?'Ouvert':i.status==='closed'?'Clôturé':'En cours'}</span>
        </div>
        <div class="inc-arrow">›</div>
      </div>`).join('');

  document.getElementById('dp-sheet').onclick=()=>window.open(CONFIG.SHEET_URL,'_blank');
  document.getElementById('dept-overlay').classList.add('open');
}
function closeDept(){
  document.getElementById('dept-overlay').classList.remove('open');
  document.querySelectorAll('.dept').forEach(el=>el.classList.remove('active'));
  currentDeptId=null;
}

// ══ INCIDENT / 8D PANEL ══
function openIncident(deptId,incIdx){
  const d=DEPTS[deptId];
  const i=d.incidents[incIdx];

  document.getElementById('ed-type').textContent=i.type;
  document.getElementById('ed-ref').textContent=`${d.name} · ${i.date}${i.ref8D?' · '+i.ref8D:''}`;
  document.getElementById('ed-status-row').innerHTML=`
    <span class="badge ${i.status==='open'?'b-open':i.status==='closed'?'b-closed':'b-prog'}" style="font-size:11px;padding:4px 12px">
      ${i.status==='open'?'Ouvert':i.status==='closed'?'Clôturé':'En cours'}
    </span>
    <span style="font-family:var(--fm);font-size:10px;color:var(--text3)">${i.id||''}</span>`;

  const steps=[
    {n:'D1',title:'Description du problème',val:i.d1},
    {n:'D2',title:'Équipe & responsables',val:i.d2},
    {n:'D3',title:'Actions de containment (immédiates)',val:i.d3},
    {n:'D4',title:'Cause racine identifiée',val:i.d4},
    {n:'D5',title:'Actions correctives permanentes',val:i.d5},
    {n:'D6',title:'Validation de l\'efficacité',val:i.d6},
    {n:'D7',title:'Actions préventives & généralisation',val:i.d7},
    {n:'D8',title:'Clôture & félicitations équipe',val:i.d8}
  ];

  document.getElementById('ed-body').innerHTML=steps.map(s=>{
    const done=!!s.val&&i.status==='closed';
    const pending=!s.val;
    const numCls=done?'done':pending?'pending':'';
    return`<div class="d-step">
      <div class="d-step-head">
        <div class="d-num ${numCls}">${s.n}</div>
        <div class="d-step-title">${s.title}</div>
        ${done?'<div class="d-step-sub" style="color:var(--green)">✓ Fait</div>':pending?'<div class="d-step-sub">En attente</div>':'<div class="d-step-sub" style="color:var(--amber)">En cours</div>'}
      </div>
      <div class="d-step-body ${pending?'empty':''}">${s.val||'Non renseigné — à compléter dans Google Sheet'}</div>
    </div>`;
  }).join('');

  document.getElementById('ed-sheet').onclick=()=>window.open(CONFIG.SHEET_URL,'_blank');
  document.getElementById('eightd-overlay').classList.add('open');
}
function close8D(){
  document.getElementById('eightd-overlay').classList.remove('open');
}
function back8D(){
  close8D();
}

// ══ DASHBOARD ══
function initCharts(){
  const vals=Object.values(DEPTS);
  let acc=0,nm=0,od=0,tot=0;
  vals.forEach(d=>{acc+=d.accidents;nm+=d.nearMiss;od+=d.open8D;tot+=d.incidents.length;});
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi"><div class="kpi-lbl">Accidents AT</div><div class="kpi-val cr">${acc}</div><div class="kpi-sub">total cumulé</div></div>
    <div class="kpi"><div class="kpi-lbl">Presque acc.</div><div class="kpi-val ca">${nm}</div><div class="kpi-sub">total cumulé</div></div>
    <div class="kpi"><div class="kpi-lbl">8D ouverts</div><div class="kpi-val cr">${od}</div><div class="kpi-sub">en cours</div></div>
    <div class="kpi"><div class="kpi-lbl">Total incidents</div><div class="kpi-val cb">${tot}</div><div class="kpi-sub">tous statuts</div></div>
    <div class="kpi"><div class="kpi-lbl">Taux AT moyen</div><div class="kpi-val ca">${(acc/vals.length).toFixed(1)}</div><div class="kpi-sub">par département</div></div>`;
  const sorted=vals.filter(d=>d.incidents.length>0).sort((a,b)=>b.incidents.length-a.incidents.length);
  const mx=sorted[0]?.incidents.length||1;
  document.getElementById('pareto').innerHTML=sorted.map(d=>{
    const pct=Math.round(d.incidents.length/mx*100);
    const c=d.open8D>0?'r':d.accidents>0?'a':'c';
    return`<div class="pareto-row"><div class="p-lbl">${d.name}</div><div class="p-bg"><div class="p-fill ${c}" style="width:${pct}%"></div></div><div class="p-n">${d.incidents.length}</div></div>`;
  }).join('');
  const tc={};vals.forEach(d=>d.incidents.forEach(i=>{tc[i.type]=(tc[i.type]||0)+1;}));
  const tk=Object.keys(tc);
  new Chart(document.getElementById('type-chart'),{type:'doughnut',data:{labels:tk,datasets:[{data:tk.map(k=>tc[k]),backgroundColor:['#3d7fff','#f05252','#f5a623','#22c97a','#a855f7','#14b8a6','#f97316'],borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#8b93a8',font:{size:10},boxWidth:10,padding:8}}}}});
  const op=vals.reduce((s,d)=>s+d.open8D,0);
  const pr=vals.reduce((s,d)=>s+d.incidents.filter(i=>i.status==='progress'&&i.ref8D).length,0);
  const cl=vals.reduce((s,d)=>s+d.incidents.filter(i=>i.status==='closed'&&i.ref8D).length,0);
  new Chart(document.getElementById('eightd-chart'),{type:'bar',data:{labels:['Ouverts','En cours','Clôturés'],datasets:[{data:[op,pr,cl],backgroundColor:['#f05252','#f5a623','#22c97a'],borderRadius:6,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b93a8'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#8b93a8',stepSize:1},grid:{color:'rgba(255,255,255,0.04)'}}}}});
  const names=vals.map(d=>d.name.length>13?d.name.slice(0,13)+'…':d.name);
  new Chart(document.getElementById('rate-chart'),{type:'bar',data:{labels:names,datasets:[{data:vals.map(d=>d.accidents),backgroundColor:vals.map(d=>d.open8D>0?'#f05252':d.accidents>0?'#f5a623':'#22c97a'),borderRadius:4,borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b93a8',stepSize:1},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#8b93a8',font:{size:10}},grid:{display:false}}}}});
  document.getElementById('dept-tbl').innerHTML=`<thead><tr><th>Département</th><th>AT</th><th>Presque acc.</th><th>8D ouverts</th><th>Incidents</th><th>Statut</th></tr></thead><tbody>${vals.sort((a,b)=>b.accidents-a.accidents).map(d=>`<tr><td>${d.name}</td><td><span class="tv ${d.accidents>0?'cr':'cg'}">${d.accidents}</span></td><td><span class="tv ca">${d.nearMiss}</span></td><td><span class="tv ${d.open8D>0?'cr':'cg'}">${d.open8D}</span></td><td><span class="tv">${d.incidents.length}</span></td><td><span class="badge ${d.open8D>0?'b-open':d.accidents>0?'b-prog':'b-closed'}">${d.open8D>0?'Critique':d.accidents>0?'Attention':'OK'}</span></td></tr>`).join('')}</tbody>`;
}
</script>
</body>
</html>
