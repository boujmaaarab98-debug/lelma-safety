<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LELMA — SQCDP</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#242d42;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf0;--text2:#8b93a8;--text3:#4a5268;
  --fh:'Syne',sans-serif;--fm:'DM Mono',monospace;
  --hdr:52px;--tab:48px;
  /* SQCDP colors */
  --s:#f05252;--s-dim:rgba(240,82,82,0.12);--s-border:rgba(240,82,82,0.3);
  --q:#3d7fff;--q-dim:rgba(61,127,255,0.12);--q-border:rgba(61,127,255,0.3);
  --c:#22c97a;--c-dim:rgba(34,201,122,0.12);--c-border:rgba(34,201,122,0.3);
  --d:#f5a623;--d-dim:rgba(245,166,35,0.12);--d-border:rgba(245,166,35,0.3);
  --p:#a855f7;--p-dim:rgba(168,85,247,0.12);--p-border:rgba(168,85,247,0.3);
  /* active module vars (updated by JS) */
  --mod:#f05252;--mod-dim:rgba(240,82,82,0.12);--mod-border:rgba(240,82,82,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:var(--fh);overflow:hidden;}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;height:var(--hdr);background:rgba(15,17,23,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.hdr-l{display:flex;align-items:center;gap:.75rem;}
.logo{font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.15em;background:var(--mod);color:#fff;padding:3px 10px;border-radius:4px;transition:background .3s;}
.hdr h1{font-size:14px;font-weight:700;}
.hdr-sub{font-family:var(--fm);font-size:9px;color:var(--text3);}
.hdr-r{display:flex;align-items:center;gap:.5rem;}
.mdate{font-family:var(--fm);font-size:10px;color:var(--text3);}
.view-toggle{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;}
.vt-btn{font-family:var(--fh);font-size:11px;font-weight:500;padding:4px 14px;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;transition:.15s;}
.vt-btn.active{background:var(--bg2);color:var(--text);border:1px solid var(--border2);}
.vt-btn:hover:not(.active){color:var(--text);}

/* ── SQCDP TAB BAR ── */
.sqcdp-bar{position:fixed;top:var(--hdr);left:0;right:0;z-index:55;display:flex;height:var(--tab);background:var(--bg2);border-bottom:1px solid var(--border);}
.sq-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--text3);border-bottom:3px solid transparent;transition:.2s;position:relative;}
.sq-tab:hover{color:var(--text2);}
.sq-tab.active{color:var(--text);border-bottom-color:var(--mod);}
.sq-tab[data-mod="S"]{--mod-tab:var(--s);}
.sq-tab[data-mod="Q"]{--mod-tab:var(--q);}
.sq-tab[data-mod="C"]{--mod-tab:var(--c);}
.sq-tab[data-mod="D"]{--mod-tab:var(--d);}
.sq-tab[data-mod="P"]{--mod-tab:var(--p);}
.sq-tab.active{border-bottom-color:var(--mod-tab);color:var(--mod-tab);}
.sq-letter{font-size:16px;font-weight:700;}
.sq-label{font-size:10px;font-weight:500;letter-spacing:.04em;}
.sq-kpi{position:absolute;right:12px;font-family:var(--fm);font-size:10px;color:var(--text3);}

/* ── VIEWS ── */
.view{position:fixed;top:calc(var(--hdr)+var(--tab));left:0;right:0;bottom:0;display:none;}
.view.active{display:block;}

/* ══ PLAN VIEW ══ */
#view-plan{background:var(--bg);}
.plan-full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem 1rem 2.6rem;}
#floorplan{width:100%;height:100%;display:block;}
.outer-wall{fill:none;stroke:rgba(255,255,255,0.18);stroke-width:2;}
.corridor{fill:rgba(255,255,255,0.03);stroke:rgba(255,255,255,0.07);stroke-width:.5;}
.dept rect{fill:rgba(255,255,255,0.03);stroke:rgba(255,255,255,0.1);stroke-width:1;transition:fill .18s,stroke .18s;}
.dept.static rect{cursor:default;}
.dept:not(.static){cursor:pointer;}
.dept:not(.static):hover rect{fill:var(--mod-dim);stroke:var(--mod);}
.dept.active rect{fill:var(--mod-dim);stroke:var(--mod);stroke-width:2;}
.dept-dot{fill:var(--text3);transition:fill .2s;}
.dept.lv-ok .dept-dot{fill:#22c97a;}
.dept.lv-warn .dept-dot{fill:#f5a623;}
.dept.lv-bad .dept-dot{fill:#f05252;}
.dt{fill:var(--text);font-family:'Syne',sans-serif;font-weight:500;text-anchor:middle;pointer-events:none;}
.ds{fill:var(--text2);font-family:'DM Mono',monospace;text-anchor:middle;pointer-events:none;}
.ds2{fill:var(--text3);font-family:'DM Mono',monospace;text-anchor:middle;pointer-events:none;}
.exit-mk{fill:#f05252;}
.north-lbl{fill:var(--text3);font-family:'Syne',sans-serif;font-weight:700;text-anchor:middle;}
.plan-legend{position:absolute;bottom:0;left:0;right:0;display:flex;gap:1.5rem;align-items:center;justify-content:center;padding:.45rem 1rem;background:rgba(15,17,23,0.8);backdrop-filter:blur(8px);border-top:1px solid var(--border);}
.leg-i{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:10px;color:var(--text3);}
.leg-dot{width:8px;height:8px;border-radius:50%;}

/* ══ SIDE PANELS ══ */
.overlay{position:fixed;inset:0;z-index:200;display:flex;pointer-events:none;opacity:0;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.ov-backdrop{flex:1;background:rgba(0,0,0,0.45);backdrop-filter:blur(3px);cursor:pointer;}
.ov-panel{height:100%;background:var(--bg2);border-left:1px solid var(--border2);display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);}
.overlay.open .ov-panel{transform:translateX(0);}
#dept-overlay .ov-panel{width:min(500px,46vw);}

/* 8D panel from LEFT */
#detail-overlay{flex-direction:row-reverse;}
#detail-overlay .ov-panel{width:min(560px,50vw);border-left:none;border-right:1px solid var(--border2);transform:translateX(-100%);}
#detail-overlay.open .ov-panel{transform:translateX(0);}

/* panel head */
.p-head{padding:1.2rem 1.4rem .85rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;flex-shrink:0;}
.p-head h2{font-size:18px;font-weight:700;line-height:1.25;}
.p-sub{font-family:var(--fm);font-size:10px;color:var(--text3);margin-top:3px;}
.p-mod-tag{display:inline-block;font-family:var(--fm);font-size:9px;font-weight:500;padding:2px 8px;border-radius:4px;margin-bottom:5px;letter-spacing:.05em;}
.ov-close{background:none;border:1px solid var(--border2);color:var(--text2);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ov-close:hover{background:var(--bg3);color:var(--text);}

/* metrics */
.p-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:.85rem 1.4rem;flex-shrink:0;}
.p-metric{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:.7rem .9rem;}
.p-mlbl{font-family:var(--fm);font-size:9px;letter-spacing:.07em;color:var(--text3);text-transform:uppercase;margin-bottom:4px;}
.p-mval{font-size:28px;font-weight:700;line-height:1;color:var(--text2);}
.p-mval.cr{color:#f05252;}.p-mval.ca{color:#f5a623;}.p-mval.cg{color:#22c97a;}.p-mval.cb{color:#3d7fff;}.p-mval.cp{color:#a855f7;}

/* items list */
.p-body{flex:1;overflow-y:auto;padding:0 1.4rem 1rem;}
.p-body::-webkit-scrollbar{width:3px;}
.p-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.p-sec{font-family:var(--fm);font-size:10px;letter-spacing:.07em;color:var(--text3);text-transform:uppercase;margin:.6rem 0;display:flex;align-items:center;justify-content:space-between;}
.p-cnt{background:var(--bg3);border:1px solid var(--border);padding:1px 8px;border-radius:10px;color:var(--text2);}

.item-row{display:flex;gap:10px;padding:11px;border-radius:9px;margin-bottom:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;transition:background .15s,border-color .15s;}
.item-row:hover{background:var(--bg4);border-color:var(--mod);}
.item-date{font-family:var(--fm);font-size:9px;color:var(--text3);min-width:68px;padding-top:2px;flex-shrink:0;}
.item-b{flex:1;min-width:0;}
.item-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px;}
.item-desc{font-size:11px;color:var(--text2);line-height:1.5;}
.item-arrow{color:var(--text3);font-size:14px;padding-top:1px;}
.badge{display:inline-block;font-family:var(--fm);font-size:9px;letter-spacing:.04em;padding:2px 8px;border-radius:10px;margin-top:4px;text-transform:uppercase;}
.b-open{background:rgba(240,82,82,.12);color:#f05252;border:1px solid rgba(240,82,82,.25);}
.b-closed{background:rgba(34,201,122,.12);color:#22c97a;border:1px solid rgba(34,201,122,.25);}
.b-prog{background:rgba(245,166,35,.12);color:#f5a623;border:1px solid rgba(245,166,35,.25);}
.no-item{text-align:center;padding:2rem;color:var(--text3);font-family:var(--fm);font-size:12px;}

.p-actions{display:flex;gap:8px;padding:.8rem 1.4rem;border-top:1px solid var(--border);flex-shrink:0;}
.p-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:7px;font-family:var(--fh);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:.15s;}
.p-btn:hover{background:rgba(255,255,255,.06);color:var(--text);}
.p-btn.prim{border-color:var(--mod-border);color:var(--mod);background:var(--mod-dim);}
.p-btn.prim:hover{filter:brightness(1.1);}

/* detail steps */
.d-back{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:10px;color:var(--text3);cursor:pointer;margin-bottom:.7rem;width:fit-content;}
.d-back:hover{color:var(--mod);}
.d-step{margin-bottom:.75rem;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.d-sh{display:flex;align-items:center;gap:9px;padding:.65rem .9rem;background:var(--bg3);}
.d-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:9px;font-weight:500;flex-shrink:0;background:var(--mod-dim);border:1px solid var(--mod-border);color:var(--mod);}
.d-num.done{background:rgba(34,201,122,.12);border-color:rgba(34,201,122,.3);color:#22c97a;}
.d-num.pending{background:var(--bg4);border-color:var(--border);color:var(--text3);}
.d-stitle{font-size:12px;font-weight:500;color:var(--text);}
.d-ssub{margin-left:auto;font-family:var(--fm);font-size:9px;color:var(--text3);}
.d-ssub.done{color:#22c97a;}.d-ssub.prog{color:#f5a623;}
.d-sb{padding:.7rem .9rem;font-size:11px;color:var(--text2);line-height:1.6;border-top:1px solid var(--border);background:var(--bg2);}
.d-sb.empty{color:var(--text3);font-family:var(--fm);font-size:10px;}

/* ══ DASHBOARD ══ */
#view-dash{overflow-y:auto;padding:1rem;display:none;flex-direction:column;gap:.75rem;}
#view-dash.active{display:flex;}
#view-dash::-webkit-scrollbar{width:4px;}
#view-dash::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;}
.kpi-lbl{font-family:var(--fm);font-size:9px;letter-spacing:.07em;color:var(--text3);text-transform:uppercase;margin-bottom:4px;}
.kpi-val{font-size:28px;font-weight:700;line-height:1;}
.kpi-val.cr{color:#f05252;}.kpi-val.ca{color:#f5a623;}.kpi-val.cg{color:#22c97a;}.kpi-val.cb{color:#3d7fff;}.kpi-val.cp{color:#a855f7;}
.kpi-sub{font-family:var(--fm);font-size:9px;color:var(--text3);margin-top:3px;}
.dash-row{display:grid;gap:.7rem;}
.dash-row.two{grid-template-columns:1fr 1fr;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;}
.card-title{font-family:var(--fm);font-size:10px;letter-spacing:.07em;color:var(--text3);text-transform:uppercase;margin-bottom:.85rem;}
.chart-wrap{position:relative;height:195px;}
.pareto-row{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.pareto-row:last-child{margin-bottom:0;}
.p-lbl{font-size:11px;color:var(--text2);min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-bg{flex:1;height:7px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.p-fill{height:100%;border-radius:3px;background:var(--mod);transition:width .5s;}
.p-n{font-family:var(--fm);font-size:10px;color:var(--text3);min-width:28px;text-align:right;}
.dept-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.dept-tbl th{font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--text3);text-transform:uppercase;padding:0 6px 7px;text-align:left;border-bottom:1px solid var(--border);}
.dept-tbl td{padding:7px 6px;border-bottom:1px solid var(--border);color:var(--text2);}
.dept-tbl tr:last-child td{border-bottom:none;}
.dept-tbl td:first-child{color:var(--text);font-weight:500;}
.tv{font-family:var(--fm);font-size:12px;font-weight:500;}
.tv.cr{color:#f05252;}.tv.ca{color:#f5a623;}.tv.cg{color:#22c97a;}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-l">
    <span class="logo" id="logo-badge">LELMA</span>
    <div><h1 id="hdr-title">Sécurité & Incendie</h1><div class="hdr-sub">Zone Franche · Tanger · Lot N°1</div></div>
  </div>
  <div class="hdr-r">
    <div class="view-toggle">
      <button class="vt-btn active" onclick="switchView('plan',this)">🗺 Plan</button>
      <button class="vt-btn" onclick="switchView('dash',this)">📊 Dashboard</button>
    </div>
    <span class="mdate" id="h-date"></span>
  </div>
</header>

<!-- SQCDP TAB BAR -->
<div class="sqcdp-bar">
  <div class="sq-tab active" data-mod="S" onclick="switchModule('S',this)">
    <span class="sq-letter" style="color:var(--s)">S</span>
    <span class="sq-label">Sécurité</span>
    <span class="sq-kpi" id="kpi-S"></span>
  </div>
  <div class="sq-tab" data-mod="Q" onclick="switchModule('Q',this)">
    <span class="sq-letter" style="color:var(--q)">Q</span>
    <span class="sq-label">Qualité</span>
    <span class="sq-kpi" id="kpi-Q"></span>
  </div>
  <div class="sq-tab" data-mod="C" onclick="switchModule('C',this)">
    <span class="sq-letter" style="color:var(--c)">C</span>
    <span class="sq-label">Coût</span>
    <span class="sq-kpi" id="kpi-C"></span>
  </div>
  <div class="sq-tab" data-mod="D" onclick="switchModule('D',this)">
    <span class="sq-letter" style="color:var(--d)">D</span>
    <span class="sq-label">Délai</span>
    <span class="sq-kpi" id="kpi-D"></span>
  </div>
  <div class="sq-tab" data-mod="P" onclick="switchModule('P',this)">
    <span class="sq-letter" style="color:var(--p)">P</span>
    <span class="sq-label">Personnel</span>
    <span class="sq-kpi" id="kpi-P"></span>
  </div>
</div>

<!-- PLAN VIEW -->
<div id="view-plan" class="view active">
  <div class="plan-full">
    <svg id="floorplan" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <rect class="corridor" x="16" y="16" width="518" height="76"/>
      <rect class="corridor" x="172" y="92" width="70" height="258"/>
      <rect class="corridor" x="362" y="92" width="70" height="112"/>
      <rect class="corridor" x="16" y="308" width="518" height="60"/>
      <rect class="outer-wall" rx="3" x="15" y="15" width="519" height="472"/>
      <g class="dept" data-id="stockage" tabindex="0" role="button"><rect x="16" y="16" width="155" height="75"/><text x="93" y="46" class="dt" font-size="11">Stockage</text><text x="93" y="64" class="ds" font-size="8.5">matière vide</text><circle class="dept-dot" cx="152" cy="29" r="7"/></g>
      <g class="dept" data-id="stockage" tabindex="0" role="button"><rect x="433" y="16" width="101" height="75"/><text x="483" y="46" class="dt" font-size="11">Stockage</text><text x="483" y="64" class="ds" font-size="8.5">matière vide</text><circle class="dept-dot" cx="524" cy="29" r="7"/></g>
      <g class="dept" data-id="qc" tabindex="0" role="button"><rect x="16" y="92" width="155" height="215"/><text x="93" y="193" class="dt" font-size="11">QT Contrôle</text><text x="93" y="212" class="ds" font-size="9">Qualité</text><text x="93" y="229" class="ds2" font-size="7.5">Consommables &amp; Acc.</text><circle class="dept-dot" cx="152" cy="107" r="7"/></g>
      <g class="dept" data-id="magasinier" tabindex="0" role="button"><rect x="243" y="92" width="118" height="108"/><text x="302" y="142" class="dt" font-size="11">Bureau</text><text x="302" y="161" class="ds" font-size="9">Magasinier</text><circle class="dept-dot" cx="346" cy="107" r="7"/></g>
      <g class="dept" data-id="methodes" tabindex="0" role="button"><rect x="243" y="201" width="118" height="106"/><text x="302" y="248" class="dt" font-size="11">Bureau Méthodes</text><text x="302" y="267" class="ds" font-size="9">&amp; CONT</text><circle class="dept-dot" cx="346" cy="215" r="7"/></g>
      <g class="dept" data-id="station" tabindex="0" role="button"><rect x="433" y="92" width="101" height="215"/><text x="483" y="193" class="dt" font-size="10" transform="rotate(-90,483,193)">Station traitement</text><text x="483" y="215" class="ds" font-size="8" transform="rotate(-90,483,218)">des effluents</text><circle class="dept-dot" cx="524" cy="107" r="7"/></g>
      <g class="dept" data-id="machine" tabindex="0" role="button"><rect x="16" y="308" width="155" height="59"/><text x="93" y="341" class="dt" font-size="11">Machine</text><circle class="dept-dot" cx="152" cy="322" r="7"/></g>
      <g class="dept" data-id="atelier" tabindex="0" role="button"><rect x="243" y="308" width="189" height="59"/><text x="337" y="334" class="dt" font-size="11">Atelier</text><text x="337" y="353" class="ds" font-size="8.5">Traitement de surfaces</text><circle class="dept-dot" cx="416" cy="322" r="7"/></g>
      <g class="dept" data-id="accueil" tabindex="0" role="button"><rect x="16" y="369" width="77" height="53"/><text x="54" y="399" class="dt" font-size="10">Accueil</text><circle class="dept-dot" cx="74" cy="382" r="6"/></g>
      <g class="dept" data-id="chef" tabindex="0" role="button"><rect x="94" y="369" width="77" height="53"/><text x="132" y="390" class="dt" font-size="10">Chef</text><text x="132" y="407" class="ds" font-size="8">de Zone</text><circle class="dept-dot" cx="152" cy="382" r="6"/></g>
      <g class="dept" data-id="infirmerie" tabindex="0" role="button"><rect x="172" y="369" width="70" height="53"/><text x="207" y="399" class="dt" font-size="10">Infirmerie</text><circle class="dept-dot" cx="222" cy="382" r="6"/></g>
      <g class="dept" data-id="reunion" tabindex="0" role="button"><rect x="348" y="369" width="85" height="53"/><text x="390" y="390" class="dt" font-size="10">Salle de</text><text x="390" y="407" class="ds" font-size="8">Réunion</text><circle class="dept-dot" cx="416" cy="382" r="6"/></g>

    magasinier:{effectif:3,absenteisme:1.5,formation:16,turnover:0,items:[]},
    methodes:  {effectif:5,absenteisme:0.8,formation:32,turnover:0,items:[]},

      {id:"RH-ATL-01",date:"28/04/2025",title:"Arrêt médical accident",desc:"Opératrice en arrêt 5j — brûlure chimique",status:"progress",steps:["Arrêt médical 5j — remplacement assuré","Chef atelier + RH + Médecin","Remplacement poste par opérateur formé","Accident chimique — EPI insuffisants","Formation EPI + suivi médical","Suivi retour travail prévu","Plan prévention mis à jour",null]},
      {id:"RH-ATL-02",date:"07/04/2025",title:"Formation sécurité",desc:"2 opérateurs non formés LOTO identifiés",status:"closed",steps:["2 opérateurs sans habilitation LOTO","RH + HSE + Chef atelier","Affectation postes sans risque LOTO","Plan formation incomplet","Formation LOTO effectuée","Habilitations délivrées 15/04","Matrice compétences mise à jour","Clôturé 16/04/2025"]}

      {id:"RH-MCH-01",date:"20/04/2025",title:"Arrêt médical fracture",desc:"Opérateur arrêt 21j — fracture doigt",status:"open",steps:["Arrêt 21j minimum — remplacement urgent","RH + Chef prod + Médecin","Intérim formé en cours","Accident CNC — procédure LOTO manquante","Formation LOTO + EPI mécaniques","Suivi médical hebdomadaire","Extension habilitations toute l'équipe",null]}
    ]},
    station:   {effectif:6,absenteisme:2.8,formation:20,turnover:5,items:[]},

    chef:      {effectif:2,absenteisme:0.5,formation:16,turnover:0,items:[]},
    infirmerie:{effectif:2,absenteisme:0.3,formation:24,turnover:0,items:[]},

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let currentMod = 'S';
let currentView = 'plan';
let currentDeptId = null;
let currentItemIdx = null;
let chartInstances = {};
let chartsBuilt = {};

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('h-date').textContent = new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
  switchModule('S', document.querySelector('.sq-tab[data-mod="S"]'));
  bindDeptClicks();
  updateTabKPIs();
});

function updateTabKPIs() {
  // S
  const sData = DATA.S; let sOpen=0; Object.values(sData).forEach(d=>sOpen+=d.open||0);
  document.getElementById('kpi-S').textContent = sOpen+' AT';
  // Q
  const qData = DATA.Q; let qOpen=0; Object.values(qData).forEach(d=>qOpen+=d.ncr||0);
  document.getElementById('kpi-Q').textContent = qOpen+' NCR';
  // C
  const cData = DATA.C; let cOver=0; Object.values(cData).forEach(d=>{ if((d.ecart||0)>0) cOver++; });
  document.getElementById('kpi-C').textContent = cOver+' écarts';
  // D
  const dData = DATA.D; let dRet=0; Object.values(dData).forEach(d=>dRet+=d.retards||0);
  document.getElementById('kpi-D').textContent = dRet+' retards';
  // P
  const pData = DATA.P; let pAbs=0; Object.values(pData).forEach(d=>pAbs+=d.items?.length||0);
  document.getElementById('kpi-P').textContent = pAbs+' actifs';
}

// ══════════════════════════════════════════
// MODULE SWITCH
// ══════════════════════════════════════════
function switchModule(mod, tabEl) {
  currentMod = mod;
  const m = MODULES[mod];

  // update CSS vars
  document.documentElement.style.setProperty('--mod', m.color);
  document.documentElement.style.setProperty('--mod-dim', m.dim);
  document.documentElement.style.setProperty('--mod-border', m.border);

  // tabs
  document.querySelectorAll('.sq-tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');

  // header
  document.getElementById('logo-badge').style.background = m.color;
  document.getElementById('hdr-title').textContent = m.hdrTitle;

  // dots on plan
  applyModuleDots();

  // rebuild dashboard if visible
  if (currentView === 'dash') buildDashboard();

  // close panels
  closeDept(); closeDetail();
}

function applyModuleDots() {
  const mod = currentMod;
  const data = DATA[mod];
  const mk = MODULES[mod].metricKeys;

  DEPTS_BASE.forEach(dept => {
    const d = data[dept.id];
    const els = document.querySelectorAll(`.dept[data-id="${dept.id}"]`);
    els.forEach(el => {
      el.classList.remove('lv-ok','lv-warn','lv-bad');
      if (!d) return;
      let level = 'lv-ok';
      if (mod==='S') level = d.open>0?'lv-bad':d.accidents>0?'lv-warn':'lv-ok';
      else if (mod==='Q') level = d.ncr>3?'lv-bad':d.ncr>0?'lv-warn':'lv-ok';
      else if (mod==='C') level = d.ecart>10?'lv-bad':d.ecart>0?'lv-warn':'lv-ok';
      else if (mod==='D') level = d.otd<80?'lv-bad':d.otd<90?'lv-warn':'lv-ok';
      else if (mod==='P') level = d.absenteisme>5?'lv-bad':d.absenteisme>2?'lv-warn':'lv-ok';
      el.classList.add(level);
    });
  });
}

// ══════════════════════════════════════════
// VIEW SWITCH
// ══════════════════════════════════════════
function switchView(v, btn) {
  currentView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.vt-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  btn.classList.add('active');
  if (v === 'dash') buildDashboard();
}

// ══════════════════════════════════════════
// DEPT PANEL
// ══════════════════════════════════════════
function bindDeptClicks() {
  document.querySelectorAll('.dept[data-id]').forEach(el => {
    el.addEventListener('click', () => openDept(el.getAttribute('data-id')));
    el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();openDept(el.getAttribute('data-id'));}});
  });
}

function openDept(id) {
  currentDeptId = id;
  const mod = currentMod;
  const m = MODULES[mod];
  const dept = DEPTS_BASE.find(d=>d.id===id);
  const d = DATA[mod][id] || {};
  const items = d.items || [];

  document.querySelectorAll('.dept').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll(`.dept[data-id="${id}"]`).forEach(el=>el.classList.add('active'));

  // mod tag
  const tag = document.getElementById('dp-mod-tag');
  tag.textContent = mod + ' — ' + m.label.toUpperCase();
  tag.style.background = m.dim; tag.style.color = m.color; tag.style.border = '1px solid '+m.border;

  document.getElementById('dp-name').textContent = dept?.name || id;
  document.getElementById('dp-zone').textContent = dept?.zone || '';
  document.getElementById('dp-cnt').textContent = items.length;

  // metrics
  const mVals = [d[m.metricKeys[0]],d[m.metricKeys[1]],d[m.metricKeys[2]],d[m.metricKeys[3]]];
  document.getElementById('dp-metrics').innerHTML = m.metrics.map((lbl,i) =>
    `<div class="p-metric"><div class="p-mlbl">${lbl}</div><div class="p-mval ${m.metricColors[i]}">${mVals[i]??'—'}</div></div>`
  ).join('');

  // items
  document.getElementById('dp-items').innerHTML = items.length === 0
    ? `<div class="no-item">✓ Aucun enregistrement</div>`
    : items.map((item,idx) => `
        <div class="item-row" onclick="openDetail(${idx})">
          <div class="item-date">${item.date}</div>
          <div class="item-b">
            <div class="item-title">${item.title} <span style="opacity:.5;font-size:9px;font-family:var(--fm)">${item.id}</span></div>
            <div class="item-desc">${item.desc}</div>
            <span class="badge ${item.status==='open'?'b-open':item.status==='closed'?'b-closed':'b-prog'}">${item.status==='open'?'Ouvert':item.status==='closed'?'Clôturé':'En cours'}</span>
          </div>
          <div class="item-arrow">›</div>
        </div>`).join('');

  document.getElementById('dept-overlay').classList.add('open');
}

function closeDept() {
  document.getElementById('dept-overlay').classList.remove('open');
  document.querySelectorAll('.dept').forEach(el=>el.classList.remove('active'));
  currentDeptId = null;
}

// ══════════════════════════════════════════
// DETAIL (8D / NCR / etc.) PANEL
// ══════════════════════════════════════════
function openDetail(idx) {
  currentItemIdx = idx;
  const mod = currentMod;
  const m = MODULES[mod];
  const d = DATA[mod][currentDeptId];
  const item = d.items[idx];
  const dept = DEPTS_BASE.find(x=>x.id===currentDeptId);

  document.getElementById('det-title').textContent = item.title;
  document.getElementById('det-sub').textContent = `${dept?.name} · ${item.date} · ${item.id}`;
  document.getElementById('det-status').innerHTML = `<span class="badge ${item.status==='open'?'b-open':item.status==='closed'?'b-closed':'b-prog'}" style="font-size:11px;padding:3px 11px">${item.status==='open'?'Ouvert':item.status==='closed'?'Clôturé':'En cours'}</span>`;

  const steps = m.detailSteps;
  document.getElementById('det-body').innerHTML = steps.map((sTitle, i) => {
    const val = item.steps?.[i];
    const isDone = !!val && item.status==='closed';
    const isPending = !val;
    return `<div class="d-step">
      <div class="d-sh">
        <div class="d-num ${isDone?'done':isPending?'pending':''}">${i+1}</div>
        <div class="d-stitle">${sTitle}</div>
        <div class="d-ssub ${isDone?'done':isPending?'':'prog'}">${isDone?'✓ Fait':isPending?'En attente':'En cours'}</div>
      </div>
      <div class="d-sb ${isPending?'empty':''}">${val || 'Non renseigné — à compléter dans Google Sheet'}</div>
    </div>`;
  }).join('');

  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail() { document.getElementById('detail-overlay').classList.remove('open'); }
function backToDepet() { closeDetail(); }
function openSheet() { window.open(CONFIG.SHEET_URL,'_blank'); }

// ══════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════
function buildDashboard() {
  const mod = currentMod;
  const m = MODULES[mod];
  const data = DATA[mod];
  const vals = DEPTS_BASE.map(d => data[d.id] || {});
  const names = DEPTS_BASE.map(d => d.name.length>13?d.name.slice(0,13)+'…':d.name);

  // destroy old charts
  ['pie-chart','line-chart','bar-chart'].forEach(id => {
    if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
  });

  // KPIs
  const mk = m.metricKeys;
  const kpiVals = mk.map(k => {
    let total = 0;
    vals.forEach(v => { if(v[k]!==undefined) total += v[k]; });
    return Math.round(total*10)/10;
  });
  document.getElementById('kpi-row').innerHTML = m.metrics.map((lbl,i) =>
    `<div class="kpi"><div class="kpi-lbl">${lbl}</div><div class="kpi-val ${m.metricColors[i]}">${kpiVals[i]}</div><div class="kpi-sub">total</div></div>`
  ).join('') + `<div class="kpi"><div class="kpi-lbl">Départements</div><div class="kpi-val cb">${DEPTS_BASE.length}</div><div class="kpi-sub">analysés</div></div>`;

  // titles
  document.getElementById('chart1-title').textContent = m.chart1;
  document.getElementById('chart2-title').textContent = m.chart2;
  document.getElementById('chart3-title').textContent = m.chart3;
  document.getElementById('chart4-title').textContent = m.chart4;

  // Pareto (items count)
  const paretoData = DEPTS_BASE.map((dept,i) => ({name:dept.name, val:(data[dept.id]?.items?.length||0)}))
    .filter(x=>x.val>0).sort((a,b)=>b.val-a.val);
  const mx = paretoData[0]?.val||1;
  document.getElementById('pareto-chart').innerHTML = paretoData.length===0
    ? '<div style="text-align:center;padding:1.5rem;color:var(--text3);font-family:var(--fm);font-size:11px">Aucune donnée</div>'
    : paretoData.map(x=>`<div class="pareto-row"><div class="p-lbl">${x.name.length>16?x.name.slice(0,16)+'…':x.name}</div><div class="p-bg"><div class="p-fill" style="width:${Math.round(x.val/mx*100)}%"></div></div><div class="p-n">${x.val}</div></div>`).join('');

  // Pie chart — items by type / status
  let openC=0,progC=0,closedC=0;
  vals.forEach(v=>(v.items||[]).forEach(i=>{
    if(i.status==='open') openC++;
    else if(i.status==='progress') progC++;
    else closedC++;
  }));
  chartInstances['pie-chart'] = new Chart(document.getElementById('pie-chart'),{
    type:'doughnut',
    data:{labels:['Ouverts','En cours','Clôturés'],datasets:[{data:[openC,progC,closedC],backgroundColor:['#f05252','#f5a623','#22c97a'],borderWidth:0,hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#8b93a8',font:{size:10},boxWidth:10,padding:8}}}}
  });

  // Line chart — evolution (dummy months)
  const months=['Jan','Fév','Mar','Avr','Mai','Jun'];
  const firstKey = mk[0];
  const lineData = months.map((_,i)=>Math.round(kpiVals[0]*(0.6+i*0.08+Math.random()*0.1)*10)/10);
  chartInstances['line-chart'] = new Chart(document.getElementById('line-chart'),{
    type:'line',
    data:{labels:months,datasets:[{label:m.metrics[0],data:lineData,borderColor:m.color,backgroundColor:m.dim,tension:.4,fill:true,pointBackgroundColor:m.color,pointRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b93a8'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#8b93a8'},grid:{color:'rgba(255,255,255,0.04)'}}}}
  });

  // Bar chart — main metric per dept
  const barVals = DEPTS_BASE.map(d=>(data[d.id]?.[mk[0]])||0);
  chartInstances['bar-chart'] = new Chart(document.getElementById('bar-chart'),{
    type:'bar',
    data:{labels:names,datasets:[{data:barVals,backgroundColor:barVals.map(v=>v===0?'#22c97a':m.color),borderRadius:4,borderWidth:0}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b93a8'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#8b93a8',font:{size:10}},grid:{display:false}}}}
  });

  // Table
  const tblCols = m.tblCols;
  const tblKeys = m.tblKeys;
  document.getElementById('dept-tbl').innerHTML = `
    <thead><tr><th>Département</th>${tblCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${DEPTS_BASE.map(dept=>{
      const dv = data[dept.id]||{};
      const cells = tblKeys.map(k=>`<td><span class="tv ${getColor(mod,k,dv[k])}">${dv[k]??'—'}</span></td>`).join('');
      const items = dv.items||[];
      const hasOpen = items.some(i=>i.status==='open');
      const hasProgress = items.some(i=>i.status==='progress');
      const statCls = hasOpen?'b-open':hasProgress?'b-prog':'b-closed';
      const statLabel = hasOpen?'Critique':hasProgress?'En cours':'OK';
      return `<tr><td>${dept.name}</td>${cells}<td><span class="badge ${statCls}">${statLabel}</span></td></tr>`;
    }).join('')}</tbody>`;
}

function getColor(mod, key, val) {
  if(val===undefined||val===null) return '';
  if(mod==='S'){if(key==='open') return val>0?'cr':'cg'; if(key==='accidents') return val>5?'cr':val>0?'ca':'cg';}
  if(mod==='Q'){if(key==='ncr') return val>3?'cr':val>0?'ca':'cg'; if(key==='rebut') return val>3?'cr':val>1?'ca':'cg';}
  if(mod==='C'){if(key==='ecart') return val>10?'cr':val>0?'ca':'cg';}
  if(mod==='D'){if(key==='otd') return val<80?'cr':val<90?'ca':'cg'; if(key==='retards') return val>5?'cr':val>0?'ca':'cg';}
  if(mod==='P'){if(key==='absenteisme') return val>5?'cr':val>2?'ca':'cg';}
  return '';
}
