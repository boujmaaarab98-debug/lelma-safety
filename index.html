<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LELMA — Sécurité Incendie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117; --bg2: #161b27; --bg3: #1e2535;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #e8eaf0; --text2: #8b93a8; --text3: #555d72;
      --accent: #3d7fff; --accent-dim: rgba(61,127,255,0.15);
      --green: #22c97a; --green-dim: rgba(34,201,122,0.12);
      --amber: #f5a623; --amber-dim: rgba(245,166,35,0.12);
      --red: #f05252; --red-dim: rgba(240,82,82,0.12);
      --corridor: rgba(34,201,122,0.08); --corridor-stroke: rgba(34,201,122,0.2);
      --dept-fill: rgba(255,255,255,0.03); --dept-stroke: rgba(255,255,255,0.12);
      --dept-hover: rgba(61,127,255,0.1); --dept-active: rgba(61,127,255,0.2);
      --font-head: 'Syne', sans-serif; --font-mono: 'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-head); font-size: 14px; line-height: 1.5; overflow: hidden; }

    /* HEADER */
    .site-header { display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; height: 56px; border-bottom: 1px solid var(--border); background: var(--bg2); gap: 1rem; }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .logo-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.15em; background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 4px; }
    .header-titles h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: var(--text); line-height: 1.2; }
    .header-sub { font-family: var(--font-mono); font-size: 10px; color: var(--text3); letter-spacing: 0.05em; }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }
    .stat-pill { font-family: var(--font-mono); font-size: 11px; padding: 4px 12px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
    .stat-pill.warning { border-color: var(--red); color: var(--red); background: var(--red-dim); }
    .mono-date { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }

    /* LAYOUT */
    .main-layout { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 56px); overflow: hidden; }

    /* PLAN */
    .plan-section { display: flex; flex-direction: column; padding: 1.25rem 1.25rem 1rem; gap: 0.75rem; overflow: hidden; border-right: 1px solid var(--border); }
    .plan-header { display: flex; align-items: baseline; justify-content: space-between; }
    .plan-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; }
    .plan-hint { font-size: 11px; color: var(--text3); }
    .plan-container { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; padding: 1rem; }
    #floorplan { width: 100%; max-height: 100%; object-fit: contain; }

    /* SVG */
    .outer-wall { fill: none; stroke: rgba(255,255,255,0.2); stroke-width: 2; }
    .corridor { fill: var(--corridor); stroke: var(--corridor-stroke); stroke-width: 0.5; }
    .dept rect { fill: var(--dept-fill); stroke: var(--dept-stroke); stroke-width: 1; transition: fill 0.18s, stroke 0.18s; }
    .dept.static rect { cursor: default; }
    .dept:not(.static) { cursor: pointer; }
    .dept:not(.static):hover rect { fill: var(--dept-hover); stroke: var(--accent); }
    .dept:not(.static):focus rect { fill: var(--dept-hover); stroke: var(--accent); outline: none; }
    .dept.active rect { fill: var(--dept-active); stroke: var(--accent); stroke-width: 1.5; }
    .dept-dot { fill: var(--text3); transition: fill 0.18s; }
    .dept.status-green .dept-dot { fill: var(--green); }
    .dept.status-amber .dept-dot { fill: var(--amber); }
    .dept.status-red .dept-dot { fill: var(--red); }
    .dept-title { fill: var(--text); font-size: 8.5px; font-family: 'Syne', sans-serif; font-weight: 500; text-anchor: middle; pointer-events: none; }
    .dept-sub { fill: var(--text2); font-size: 7px; font-family: 'DM Mono', monospace; text-anchor: middle; pointer-events: none; }
    .dept-sub2 { fill: var(--text3); font-size: 6.5px; font-family: 'DM Mono', monospace; text-anchor: middle; pointer-events: none; }
    .exit-marker { fill: var(--red); }
    .north-label { fill: var(--text2); font-size: 10px; font-family: 'Syne', sans-serif; font-weight: 700; text-anchor: middle; }

    /* LEGEND */
    .legend { display: flex; gap: 1.5rem; align-items: center; padding: 0 0.25rem; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--text3); }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .leg-dot.green { background: var(--green); }
    .leg-dot.amber { background: var(--amber); }
    .leg-dot.red { background: var(--red); }
    .leg-exit { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 9px solid var(--red); }

    /* PANEL */
    .detail-panel { background: var(--bg2); overflow-y: auto; display: flex; flex-direction: column; }
    .panel-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: var(--text3); text-align: center; padding: 2rem; }
    .empty-icon { opacity: 0.3; color: var(--text2); }
    .panel-empty p { font-size: 13px; line-height: 1.6; color: var(--text3); }
    .panel-content { padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .panel-dept-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
    .panel-dept-header h2 { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .panel-dept-zone { font-family: var(--font-mono); font-size: 10px; color: var(--text3); letter-spacing: 0.04em; }
    .panel-close { background: none; border: 1px solid var(--border); color: var(--text2); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .panel-close:hover { background: var(--bg3); }

    /* METRICS */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; }
    .metric-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; color: var(--text3); text-transform: uppercase; margin-bottom: 4px; }
    .metric-value { font-size: 28px; font-weight: 700; line-height: 1; color: var(--text2); }
    .metric-value.c-red { color: var(--red); }
    .metric-value.c-amber { color: var(--amber); }
    .metric-value.c-green { color: var(--green); }

    /* INCIDENTS */
    .incidents-section { border-top: 1px solid var(--border); padding-top: 1rem; }
    .incidents-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.07em; color: var(--text3); text-transform: uppercase; }
    .incidents-count { background: var(--bg3); border: 1px solid var(--border); padding: 2px 8px; border-radius: 12px; color: var(--text2); }
    .incident-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .incident-row:last-child { border-bottom: none; }
    .inc-date { font-family: var(--font-mono); font-size: 9px; color: var(--text3); min-width: 68px; padding-top: 2px; }
    .inc-body { flex: 1; }
    .inc-type { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
    .inc-desc { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
    .inc-action { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }
    .badge { display: inline-block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 10px; margin-top: 5px; text-transform: uppercase; }
    .badge-open { background: var(--red-dim); color: var(--red); border: 1px solid rgba(240,82,82,0.25); }
    .badge-closed { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,201,122,0.25); }
    .badge-progress { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,166,35,0.25); }
    .no-incidents { text-align: center; padding: 1.5rem; color: var(--text3); font-size: 12px; font-family: var(--font-mono); }

    /* ACTIONS */
    .panel-actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 1rem; }
    .btn-action { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border-radius: 7px; font-family: var(--font-head); font-size: 12px; font-weight: 500; cursor: pointer; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); transition: background 0.15s, color 0.15s; }
    .btn-action:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .btn-action.primary { background: var(--accent-dim); border-color: rgba(61,127,255,0.3); color: #7aaeff; }
    .btn-action.primary:hover { background: rgba(61,127,255,0.25); color: #fff; }
    .detail-panel::-webkit-scrollbar { width: 4px; }
    .detail-panel::-webkit-scrollbar-track { background: transparent; }
    .detail-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  </style>
</head>

// =============================================
// APP LOGIC
// =============================================
let activeDeptId = null;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  applyStatusDots();
  updateHeaderStats();
  document.querySelectorAll('.dept[data-id]').forEach(el => {
    el.addEventListener('click', () => selectDept(el.getAttribute('data-id')));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectDept(el.getAttribute('data-id')); } });
  });
});

function applyStatusDots() {
  Object.entries(DEPARTMENTS).forEach(([id, dept]) => {
    const status = dept.open8D > 0 ? 'red' : (dept.accidents > 0 || dept.nearMiss > 0) ? 'amber' : 'green';
    document.querySelectorAll(`.dept[data-id="${id}"]`).forEach(el => el.classList.add(`status-${status}`));
  });
}

function updateHeaderStats() {
  let totalAcc = 0, totalOpen8D = 0;
  Object.values(DEPARTMENTS).forEach(d => { totalAcc += d.accidents; totalOpen8D += d.open8D; });
  document.getElementById('header-stat-acc').textContent = `${totalAcc} AT`;
  const dEl = document.getElementById('header-stat-8d');
  dEl.textContent = `${totalOpen8D} 8D ouverts`;
  dEl.className = totalOpen8D > 0 ? 'stat-pill warning' : 'stat-pill';
}

function selectDept(id) {
  activeDeptId = id;
  document.querySelectorAll('.dept').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`.dept[data-id="${id}"]`).forEach(el => el.classList.add('active'));
  const dept = DEPARTMENTS[id];
  if (!dept) return;

  document.getElementById('panel-empty').style.display = 'none';
  document.getElementById('panel-content').style.display = 'flex';
  document.getElementById('panel-dept-name').textContent = dept.name;
  document.getElementById('panel-dept-zone').textContent = dept.zone;
  document.getElementById('incidents-count').textContent = dept.incidents.length;

  const accClass = dept.accidents > 5 ? 'c-red' : dept.accidents > 0 ? 'c-amber' : 'c-green';
  const openClass = dept.open8D > 0 ? 'c-red' : 'c-green';
  document.getElementById('metrics-grid').innerHTML = `
    <div class="metric-card"><div class="metric-label">Accidents AT</div><div class="metric-value ${accClass}">${dept.accidents}</div></div>
    <div class="metric-card"><div class="metric-label">Presque accidents</div><div class="metric-value c-amber">${dept.nearMiss}</div></div>
    <div class="metric-card"><div class="metric-label">8D ouverts</div><div class="metric-value ${openClass}">${dept.open8D}</div></div>
    <div class="metric-card"><div class="metric-label">Total incidents</div><div class="metric-value">${dept.incidents.length}</div></div>`;

  document.getElementById('incidents-list').innerHTML = dept.incidents.length === 0
    ? '<div class="no-incidents">✓ Aucun incident enregistré</div>'
    : dept.incidents.map(i => `
        <div class="incident-row">
          <div class="inc-date">${i.date}</div>
          <div class="inc-body">
            <div class="inc-type">${i.type}${i.ref8D ? ` <span style="opacity:.6;font-size:10px;font-family:var(--font-mono)">${i.ref8D}</span>` : ''}</div>
            <div class="inc-desc">${i.desc}</div>
            <div class="inc-action">→ ${i.action}</div>
            <span class="badge ${i.status==='open'?'badge-open':i.status==='closed'?'badge-closed':'badge-progress'}">${i.status==='open'?'Ouvert':i.status==='closed'?'Clôturé':'En cours'}</span>
          </div>
        </div>`).join('');

  document.getElementById('btn-open-sheet').onclick = () => window.open(CONFIG.SHEET_URL, '_blank');
}

function closeDept() {
  activeDeptId = null;
  document.querySelectorAll('.dept').forEach(el => el.classList.remove('active'));
  document.getElementById('panel-empty').style.display = '';
  document.getElementById('panel-content').style.display = 'none';
}

function exportDept() {
  if (!activeDeptId) return;
  alert('Export PDF — à connecter avec jsPDF ou backend.');
}
</script>
